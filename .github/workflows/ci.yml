name: CI

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 = LTS (release toolchain), 26 = current — catches cross-major breakage
        # like fd-slicer's zip extraction stalling on Node 26 (#49).
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install ALSA dev headers
        run: sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install ALSA dev headers
        run: sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

  # Installing the Electron binary exercises npm's install scripts, @electron/get's
  # 200 MB download and zip extraction — the path that silently produced no binary on
  # Node 26 (#49). Assert the postinstall's contract, not just that npm exited 0.
  electron-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install ALSA dev headers
        run: sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Electron binary was extracted
        run: |
          node -e "
            const { getElectronBinaryState } = require('./scripts/check-electron.js')
            const { state, binaryPath } = getElectronBinaryState(process.cwd())
            console.log('electron state:', state, binaryPath || '')
            if (state !== 'ok') {
              console.error('::error::Electron binary missing after npm ci (' + state + ') — the postinstall repair path failed')
              process.exit(1)
            }
          "

  # The app ships for Windows, macOS and Linux, so the interface is exercised on all
  # three. The Windows lane matters most of all — it is the platform the product is for —
  # and Linux needs a display, which a runner does not have.
  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ALSA dev headers
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      # Electron opens a real window, so Linux needs a display server of its own.
      - name: E2E tests (under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
