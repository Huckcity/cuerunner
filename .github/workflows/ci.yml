# Every lane runs on GitHub-hosted runners. This repository is public, and a fork's pull request
# runs the workflow files in that pull request, which can name any runner label: a self-hosted
# runner registered here would run a stranger's code. `scripts/public-runners.test.ts` holds this.
name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    # Code, and only code. A change to the ledger, a story record or the release checklist
    # cannot move the engine, the e2e suite or the packaged install, and running sixteen jobs
    # on a one-line bookkeeping edit is what put fourteen pull requests in one queue. Those
    # changes go to `records.yml`, which runs the suites that actually read them; everything
    # listed here is something a heavy lane builds, runs or consumes.
    paths:
      - 'src/**'
      - 'native/**'
      - 'e2e/**'
      - 'integration/**'
      - 'scripts/**'
      - 'website/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'electron.vite.config.*'
      - '.github/workflows/**'


# A push supersedes the run before it: what a pull request needs is the answer for its
# newest commit, and without this every push queues a whole extra run beside the one already
# running — three pushes, three full matrices, all competing for the same slots. Cancelling is
# per branch and per workflow, so `soak.yml`'s night is untouched (it holds its own group and
# runs on a schedule rather than a push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: [ubuntu-24.04]
    strategy:
      fail-fast: false
      matrix:
        # 24 = LTS (release toolchain), 26 = current — catches cross-major breakage
        # like fd-slicer's zip extraction stalling on Node 26 (#49).
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint the workflows
        # Once, not once per Node version: a workflow is not Node's business. The tool is
        # pinned and fetched by the script itself, which also says what it does and does not
        # catch (`scripts/lint-workflows.mjs`). Without this step the workflow files are the
        # one part of the repository no lane reads — an edit with a misspelled key is first
        # noticed by a release that does not start.
        if: matrix.node-version == 24
        run: node scripts/lint-workflows.mjs

  # The suite runs on all three platforms the app ships to, not only where it is convenient:
  # most of it is the main process — the workspace and its atomic write, the audio wire, the
  # redundancy service — and those are exactly the places a platform shows up. It ran on
  # Linux alone until the first Windows run of it found 24 failures, most of them tests that
  # had only ever been written against POSIX (a mode that makes a write fail, a directory's
  # permissions, `bash` for the release tooling's own scripts); those state their platform now,
  # and the two that were real — an engine on a machine with no output endpoint, and a port
  # Windows hands out twice — are fixed rather than skipped.
  unit-test:
    name: unit-test (${{ matrix.label }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24 = LTS (release toolchain), 26 = current — catches cross-major breakage like
          # fd-slicer's zip extraction stalling on Node 26 (#49) — on each of the three.
          - label: linux
            runner: [ubuntu-24.04]
            node-version: 24
          - label: linux
            runner: [ubuntu-24.04]
            node-version: 26
          - label: windows
            runner: [windows-2025]
            node-version: 24
          - label: windows
            runner: [windows-2025]
            node-version: 26
          - label: macos
            runner: [macos-15]
            node-version: 24
          - label: macos
            runner: [macos-15]
            node-version: 26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # A working copy the runner kept from an earlier run is what it was: `.gitattributes`
      # changes what a checkout *writes*, not what is already on disk, and nothing short of
      # removing a file makes git write it again — `git checkout-index -a -f` left it CRLF, and
      # so did the same with `core.autocrlf=false`, measured in the Windows runner's own
      # checkout, where 1766 tracked files were still CRLF for the tests that read the
      # repository as text. Removing the ones git reports as CRLF and checking them out again
      # writes them with the attribute, which is LF; the same measurement showed it working.
      - name: Normalise line endings
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process')
          const { rmSync } = require('node:fs')
          const crlf = execFileSync('git', ['ls-files', '--eol'], { encoding: 'utf8' })
            .split('\n')
            .filter((line) => line.includes('w/crlf'))
            .map((line) => line.split('\t').pop().trim())
            .filter(Boolean)
          if (crlf.length === 0) {
            console.log('every checkout file is already LF')
            return
          }
          for (const file of crlf) rmSync(file, { force: true })
          execFileSync('git', ['checkout', '--', '.'], { stdio: 'inherit' })
          console.log(`${crlf.length} files were CRLF and are LF now`)

      - name: Install ALSA dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      # `npm test` builds the native engine first: the compiler has to be on PATH, and on
      # Windows that means importing the developer environment, the same way the e2e job
      # does it and for the same reason.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (echo ::error::no Visual Studio with the C++ tools was found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>>"%GITHUB_ENV%"
          for %%p in ("%PATH:;=" "%") do echo %%~p>>"%GITHUB_PATH%"
          rem Last, so it comes first: Git for Windows also has a `link`, and it is not the linker.
          echo %VCToolsInstallDir%bin\Hostx64\x64>>"%GITHUB_PATH%"

      - name: Locate the ASIO SDK
        if: runner.os == 'Windows'
        shell: cmd
        # Opt-in on the machine, like the e2e lane: a runner with an SDK builds with ASIO, and
        # one without gets this warning and an honest build without it.
        run: |
          set "ASIO=%CUERUNNER_ASIO_SDK%"
          if "%ASIO%"=="" if exist "C:\asio-sdk\ASIOSDK\common\asio.h" set "ASIO=C:\asio-sdk\ASIOSDK"
          if "%ASIO%"=="" (echo ::warning::No ASIO SDK found - set CUERUNNER_ASIO_SDK or unpack the SDK at C:\asio-sdk\ASIOSDK; the build will report ASIO as off. & exit /b 0)
          echo CUERUNNER_ASIO_SDK=%ASIO%>>"%GITHUB_ENV%"
          echo Using the ASIO SDK at %ASIO%

      - run: npm ci --legacy-peer-deps

      # `package.json` already approves Electron's install script for npm 12 (`allowScripts`, which
      # npm 11 ignores) — this is not the install-scripts gate: the `install-scripts` warning this
      # lane prints is fsevents, whose script is optional and skipped. It is order. npm runs a
      # dependency's install scripts before the root postinstall, so on Node 26 Electron's own
      # postinstall extracts its zip *before* `scripts/postinstall.js` has patched fd-slicer, and
      # that extraction stalls in silence (see patch-fd-slicer.js: no error, no non-zero exit — a
      # partial `dist`, no `path.txt`). The root postinstall patches fd-slicer and re-runs the
      # extraction; this step guards that outcome, in place of the postinstall, because Electron's
      # own `install.js` is not subject to npm's gate (`npm rebuild electron` is). Bounded retry
      # for the network, and the job fails if the binary truly cannot be had rather than letting
      # one file report it. The `electron-install` lane covers the same install on a clean tree.
      - name: Make sure Electron's binary arrived
        shell: node {0}
        run: |
          const { execFileSync } = require('node:child_process')
          const works = () => {
            try {
              execFileSync(process.execPath, ['-e', "require('electron')"], { stdio: 'ignore' })
              return true
            } catch {
              return false
            }
          }
          if (works()) {
            console.log("Electron's binary is already in place")
            return
          }
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              execFileSync(process.execPath, ['node_modules/electron/install.js'], { stdio: 'inherit' })
            } catch (error) {
              console.log(`attempt ${attempt} did not finish: ${error.message}`)
            }
            if (works()) {
              console.log(`Electron's binary arrived on attempt ${attempt}`)
              return
            }
          }
          console.error("Electron's binary could not be downloaded")
          process.exit(1)

      - name: Unit tests
        run: npm test

  # The playback engine is C++ and is part of the app: its deterministic offline-render
  # acceptance suite (exact start/stop/fade frames, routing, streaming, cache, M4A) runs
  # here. `npm run test:native` builds the engine and, on Linux, the pinned LGPL FFmpeg
  # helper through its pre-hook; the helper is cached so an unchanged pin costs nothing.
  # Installing the Electron binary exercises npm's install scripts, @electron/get's
  # 200 MB download and zip extraction — the path that silently produced no binary on
  # Node 26 (#49). Assert the postinstall's contract, not just that npm exited 0.
  electron-install:
    runs-on: [ubuntu-24.04]
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Electron binary was extracted
        run: |
          node -e "
            const { getElectronBinaryState } = require('./scripts/check-electron.js')
            const { state, binaryPath } = getElectronBinaryState(process.cwd())
            console.log('electron state:', state, binaryPath || '')
            if (state !== 'ok') {
              console.error('::error::Electron binary missing after npm ci (' + state + ') — the postinstall repair path failed')
              process.exit(1)
            }
          "

  # The app ships for Windows, macOS and Linux, so the interface is exercised on all
  # three. The Windows lane matters most of all — it is the platform the product is for.
  # `label` is the lane's name (the job's,
  # and the failure artifact's), `runner` is where it runs.
  e2e:
    # Without this the job is named after every matrix value it carries, which for the
    # self-hosted lane is the whole label list.
    name: e2e (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # A hosted Mac took 17 minutes on one run and passed 30 on the next, and the first run after
    # the FFmpeg helper's flags change builds it from source.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [ubuntu-24.04]
            label: linux
          # Windows runs on the NUC (`nuc-win-1`, an Intel NUC10i7FNH): the same x64 Windows
          # Provisioning: `C:\actions-runner` on that box, with its own Node and MSVC.
          - runner: [windows-2025]
            label: windows
          - runner: [macos-15]
            label: macos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      # A video cue's sound is decoded by the engine: on Linux through the packaged FFmpeg
      # helper (Windows and macOS use their own codecs), so the lane builds it — from the
      # cache, keyed like the native lane's — and e2e/visual-cues.spec.ts asserts the voice
      # on every lane rather than calling it unproven here.
      - name: Cache the packaged decoder (pinned FFmpeg release build)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: native/audio/build/decoders
          key: ffmpeg-helper-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-linux.mjs') }}

      - name: Build the engine and the decoder
        if: runner.os == 'Linux'
        run: node scripts/ensure-native.mjs --with-decoders

      # Electron tests use the app's own Chromium, so nothing is downloaded; a Linux host
      # still needs the system libraries a Chromium process links against. GitHub's
      - name: Install runtime dependencies
        if: runner.os == 'Linux'
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb


      # The app runs the native engine; on Windows the compiler is installed but not on
      # PATH unless the developer environment is imported. This is done here rather than
      # with `ilammy/msvc-dev-cmd`, which was the last thing in these workflows still
      # targeting Node 20: what it does for this lane is vswhere to find the tools,
      # vcvars64 to import them, and the two variable files GitHub gives a step.
      # `vcvars64` is the x64-targeting variant, which is what the installer builds for.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (echo ::error::no Visual Studio with the C++ tools was found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>>"%GITHUB_ENV%"
          for %%p in ("%PATH:;=" "%") do echo %%~p>>"%GITHUB_PATH%"
          rem Last, so it comes first: Git for Windows also has a `link`, and it is not the linker.
          echo %VCToolsInstallDir%bin\Hostx64\x64>>"%GITHUB_PATH%"

      # Same reason as the step above: the suite builds the native engine, and ASIO is
      # opt-in on the machine rather than in the repository (Steinberg's licence forbids
      # redistributing the SDK). A runner with an SDK builds with ASIO; one without gets
      # this warning and an honest build without it. scripts/asio-sdk.mjs reads
      # CUERUNNER_ASIO_SDK and nothing else, so this step is the only place the path is
      # decided: the variable a provisioned runner sets by hand, then the documented
      # default location.
      - name: Locate the ASIO SDK
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "ASIO=%CUERUNNER_ASIO_SDK%"
          if "%ASIO%"=="" if exist "C:\asio-sdk\ASIOSDK\common\asio.h" set "ASIO=C:\asio-sdk\ASIOSDK"
          if "%ASIO%"=="" (echo ::warning::No ASIO SDK found - set CUERUNNER_ASIO_SDK or unpack the SDK at C:\asio-sdk\ASIOSDK; the build will report ASIO as off. & exit /b 0)
          echo CUERUNNER_ASIO_SDK=%ASIO%>>"%GITHUB_ENV%"
          echo Using the ASIO SDK at %ASIO%

      # Electron opens a real window; the wrapper gives it a private Xvfb display on
      # Linux, where a runner has none of its own (scripts/run-e2e.js).
      # Two processes on a Mac: a hosted Mac has hung launching the app after about 515 launches in
      # one worker, and a fresh process starts clean.
      - name: E2E tests
        if: runner.os != 'macOS'
        run: npm run test:e2e

      - name: E2E tests, first half
        if: runner.os == 'macOS'
        run: npm run test:e2e -- --shard=1/2

      - name: E2E tests, second half
        if: runner.os == 'macOS'
        run: npm run test:e2e -- --shard=2/2

      # The one half of ASIO that no other lane can reach: hosting a real driver. It needs
      # a build with the SDK (the step above) and a driver the machine has installed —
      # an interface's own, or Steinberg's built-in ASIO driver, which drives whatever
      # Windows endpoint the machine has. With no driver it says so, reports `ASIO hosting:
      # unproven` for this run, and passes: that is the honest state of a runner with no
      # interface attached, and nothing here claims ASIO works on such a machine. The no-SDK
      # branch states the same claim from the state it knows — the engine was built without
      # ASIO, so nothing could be hosted — and `--report` leaves it in a file either way.
      - name: ASIO device smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if "%CUERUNNER_ASIO_SDK%"=="" (
            echo ::notice::No ASIO SDK on this runner - the engine is built without ASIO, so this run hosted no driver and ASIO hosting is unproven for it
            node native/audio/tests/asio-smoke.mjs --report test-results/asio-lane.json --no-driver "no ASIO SDK on this runner: the engine is built without ASIO" || exit /b 1
            exit /b 0
          )
          npm run test:native:asio -- --report test-results/asio-lane.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.label }}
          path: test-results/
          retention-days: 7

      # What this lane said about the claim, kept whether or not the lane went red: a green run
      # that hosted a driver is the evidence the record rests on, and a run with no driver is
      # the one a reader most needs to see. Only the Windows lane writes it, hence the ignore.
      - name: Upload the lane status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lane-status-${{ matrix.label }}
          path: test-results/asio-lane.json
          if-no-files-found: ignore
          retention-days: 7

  # The harness: Cuerunner talking to a peer that stands in for the console and the desk.
  # No vendor software and no hardware on this lane — the peers are implementations of the
  # vendors' published protocols, written from their own documents (INTEGRATION-HARNESS.md,
  # §2), and `harness-*.spec.ts` holds them to those documents with no app running at all.
  # What really exercises a desk — an SQ, an Avantis, a console running ETCnomad — is the
  # vendor and hardware lanes, which are nightly and on demand rather than per pull request.
  integration:
    runs-on: [ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      # Same reason as the E2E lane above: this one launches real Electron windows, so it
      # needs the libraries a Chromium process links against and the Xvfb that
      # scripts/run-e2e.js puts them on.
      - name: Install runtime dependencies
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb


      - name: Integration tests
        env:
          # The vendor chain answered from the recording the nightly made against a real
          # console, so the two @vendor assertions run on every pull request with no
          # console anywhere — which is what the fixture and the peer's replay mode are
          # for (INTEGRATION-HARNESS.md §9).
          EOS_REPLAY: integration/fixtures/vendor/eos-ubox-win.json
        run: npm run test:integration

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: test-results/
          retention-days: 7

      # The suite's own report, kept on a green run too: this is the job whose lanes a reader
      # asks about — the peers lane ran, the desk lanes skipped for want of a desk — and the
      # statuses are the answer, whether or not anything failed.
      - name: Upload the lane status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lane-status
          path: test-results/lane-status.json
          if-no-files-found: ignore
          retention-days: 7
