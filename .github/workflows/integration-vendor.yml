name: Integration (vendor)

# The lane that keeps the peers honest: real console software, on a machine that has been
# provisioned for it (INTEGRATION-HARNESS.md §9). It is not a per-pull-request lane — the
# ETCnomad package is three quarters of a gigabyte and the app wants a GUI session — so it
# runs nightly and on demand, and its job is twofold: prove the peer still behaves the way
# the console does, and record what the console actually said so the peer lane can replay a
# real session on Linux.
#
# The workflow's other job is the A&H desk path: MIDI Control's virtual port, bridged to the
# harness's peer standing in for a desk. ETCnomad is the console itself, so that half is
# configuration-by-artifact once it is done once; no A&H desktop application is a desk, so
# the bridge route operators take is what the desk half measures (§2, §11).
on:
  schedule:
    # Before the soak, which owns the small hours.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      record:
        description: Record the console's answers to a fixture the peer lane replays
        type: boolean
        default: false

concurrency:
  group: integration-vendor
  cancel-in-progress: false

jobs:
  eos-windows:
    runs-on: [self-hosted, windows, x64, win-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The console software is installed by hand, once, because its installer and its OSC
      # settings are both interactive — see INTEGRATION-HARNESS.md §9. What the workflow
      # can do is refuse to pretend it is there: a run that cannot find the console fails
      # with the step that is missing rather than with a mysterious timeout in a spec.
      - name: The console software is provisioned on this runner
        shell: pwsh
        run: |
          # ETC's own deployment script looks for exactly this path (INTEGRATION-HARNESS.md §9).
          $console = 'C:\Program Files\ETC\EosFamily\v3\Eos\Eos.exe'
          if (-not (Test-Path $console)) {
            throw "ETCnomad is not installed on this runner — §9 of INTEGRATION-HARNESS.md has the walkthrough: download the 'Consoles and ETCnomad PC' package from ETC's All Eos Family Software Versions page, install it with /S, then open it once and enable UDP Strings & OSC (Setup > Device Settings > Network) and OSC RX/TX (Setup > Show Control > OSC) — both of those are console settings, so they are done by hand."
          }
          Write-Host "found $console"

      - run: npm ci --legacy-peer-deps

      - name: Launch the console software
        shell: pwsh
        run: |
          # The launcher a person uses, where ETC's installer actually puts it (the install
          # tree was read off the runner rather than guessed: Eos.exe is the marker, and the
          # shell that starts it lives beside its own utilities). The show it comes up on is
          # whatever the provisioned session left as last-used, which is what the spec's
          # checklist describes: a cue in cue list 1, and OSC RX/TX configured.
          $launcher = 'C:\Program Files\ETC\EosFamily\v3\ETC_Launch\ETC_LaunchOffline.exe'
          Start-Process -FilePath $launcher
          # The shell takes a while — it loads the fixture library, and it may open on the
          # shell rather than straight into a show. Nothing here depends on being fast or on
          # what comes up: the spec's first test waits for the console to answer and fails
          # with the checklist if it never does. This step says what is running, no more.
          Start-Sleep -Seconds 20
          Get-Process -Name ETC_LaunchOffline, Eos -ErrorAction SilentlyContinue |
            Select-Object Name, Id, SessionId | Format-Table -AutoSize | Out-String | Write-Host

      # The test step builds the native engine first (pretest:integration → ensure-native.mjs),
      # and on Windows the compiler is installed but not on PATH until the developer
      # environment is imported: without this the step dies a second in with
      # "native-audio: MSVC (cl.exe) is not on PATH". The same block is in ci.yml's e2e lane
      # and in build.yml, done inline rather than with `ilammy/msvc-dev-cmd` so that nothing
      # here targets Node 20.
      - name: Set up MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (echo ::error::no Visual Studio with the C++ tools was found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>>"%GITHUB_ENV%"
          for %%p in ("%PATH:;=" "%") do echo %%~p>>"%GITHUB_PATH%"

      # The native engine this lane builds has an optional ASIO backend, and the SDK
      # behind it cannot be shipped with the repository (Steinberg's licence forbids
      # redistributing it): a runner that has an SDK builds with ASIO, and one that does
      # not builds without it — a warning here, not a failure. scripts/asio-sdk.mjs reads
      # CUERUNNER_ASIO_SDK and nothing else, so this step is the only place the path is
      # decided: the variable a provisioned runner sets by hand, then the documented
      # default location.
      - name: Locate the ASIO SDK
        shell: cmd
        run: |
          set "ASIO=%CUERUNNER_ASIO_SDK%"
          if "%ASIO%"=="" if exist "C:\asio-sdk\ASIOSDK\common\asio.h" set "ASIO=C:\asio-sdk\ASIOSDK"
          if "%ASIO%"=="" (echo ::warning::No ASIO SDK found - set CUERUNNER_ASIO_SDK or unpack the SDK at C:\asio-sdk\ASIOSDK; the build will report ASIO as off. & exit /b 0)
          echo CUERUNNER_ASIO_SDK=%ASIO%>>"%GITHUB_ENV%"
          echo Using the ASIO SDK at %ASIO%

      - name: Integration (vendor)
        env:
          # The console is on this machine. A run against a console elsewhere sets these
          # as repository variables instead.
          EOS_TARGET: ${{ vars.EOS_TARGET || '127.0.0.1:8000' }}
          EOS_CUE: ${{ vars.EOS_CUE || '12' }}
          # The port the console's own OSC TX destination names (§9) — it is typed into the
          # desk once, so it is single-valued: the app listens there in a direct run, and the
          # recorder listens there (with the app behind it on EOS_APP_PORT) when recording.
          EOS_CONSOLE_TX_PORT: ${{ vars.EOS_CONSOLE_TX_PORT || '8002' }}
          EOS_APP_PORT: ${{ vars.EOS_APP_PORT || '8001' }}
          EOS_RECORD: ${{ inputs.record && 'integration/fixtures/vendor/eos-ubox-win.json' || '' }}
        # The tag is quoted, and that is load bearing: under `shell: pwsh` — which is also
        # the default shell on a Windows runner, so the line cannot dodge it — a bare
        # `@vendor` is parsed as a splat, and the step dies a second in with "The variable
        # '$vendor' cannot be retrieved because it has not been set" before any test runs.
        run: npm run test:integration -- --grep "@vendor"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-vendor-results
          path: |
            test-results/
            integration/fixtures/vendor/
          retention-days: 14

  # The A&H half of the vendor lane: the desk path users actually take — MIDI Control's
  # virtual port bridged to a desk's TCP endpoint — measured against this harness's peer
  # standing in for the desk (INTEGRATION-HARNESS.md §2, §9, §11). The Eos job above is the
  # other half, and the two share nothing but the trigger and the runner: ETCnomad *is* a
  # console, and no A&H desktop application is a desk, so the bridge is what an operator with
  # a network cable goes through.
  #
  # The job is gated on the repository variable that names the virtual port, because MIDI
  # Control is installed by hand: a runner that has not been provisioned reports the job
  # skipped rather than failing the nightly, the way any lane without its counterpart does
  # (§2). A run that has the variable does get the refusal below if the machine cannot produce
  # the port.
  ah-windows:
    if: ${{ vars.AH_MIDI_PORT != '' }}
    runs-on: [self-hosted, windows, x64, win-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci --legacy-peer-deps

      # A&H MIDI Control is installed and run by hand, once, and so is the bridge it carries:
      # the virtual port it creates is named whatever the machine names it, and the address
      # it dials is typed into its own window. What the workflow can do is refuse to pretend
      # either exists (INTEGRATION-HARNESS.md §9) — and the port lists are how it checks: the
      # app sends to the port and listens on it (the bridge is two-way), so the name has to be
      # in both lists, and each list is reported when it is not.
      #
      # This step is after `npm ci` because the port lists come from the app's own MIDI module.
      - name: A&H MIDI Control and its virtual port are provisioned on this runner
        shell: pwsh
        env:
          AH_MIDI_PORT: ${{ vars.AH_MIDI_PORT || '' }}
          AH_DESK_TARGET: ${{ vars.AH_DESK_TARGET || '127.0.0.1:51325' }}
        run: |
          if (-not $env:AH_MIDI_PORT) {
            throw "no virtual port named — install A&H MIDI Control on this runner, bridge its virtual port to the desk's own TCP endpoint, note the port's name in this machine's MIDI port list, and set it as the repository variable AH_MIDI_PORT. INTEGRATION-HARNESS.md §9 has the walkthrough."
          }
          node -e 'let midi; try { midi = require("midi") } catch (error) { console.error("::error::the native MIDI module did not load (" + error.message + "), and it is what reads the port lists — npm ci builds it, which needs the C++ tools this runner has. INTEGRATION-HARNESS.md section 9 is the walkthrough."); process.exitCode = 1 } if (midi) { const output = new midi.Output(); const outputs = Array.from({ length: output.getPortCount() }, (_, i) => output.getPortName(i)); output.closePort(); const input = new midi.Input(); const inputs = Array.from({ length: input.getPortCount() }, (_, i) => input.getPortName(i)); input.closePort(); const missing = []; if (!outputs.includes(process.env.AH_MIDI_PORT)) missing.push("output"); if (!inputs.includes(process.env.AH_MIDI_PORT)) missing.push("input"); if (missing.length > 0) { console.error("::error::no MIDI " + missing.join(" or ") + " port named " + JSON.stringify(process.env.AH_MIDI_PORT) + " on this runner — output ports: " + JSON.stringify(outputs) + ", input ports: " + JSON.stringify(inputs) + ". The app sends to the port and listens on it, so both lists have to carry it. A&H MIDI Control creates the virtual port while it is running; INTEGRATION-HARNESS.md section 9 has the walkthrough."); process.exitCode = 1 } else { console.log("found the virtual port " + process.env.AH_MIDI_PORT + " in the output and input lists, bridged to " + process.env.AH_DESK_TARGET) } }'

      # The test step builds the native engine first, which on Windows needs the developer
      # environment imported — the same block the Eos job and ci.yml’s e2e lane carry.
      - name: Set up MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (echo ::error::no Visual Studio with the C++ tools was found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>>"%GITHUB_ENV%"
          for %%p in ("%PATH:;=" "%") do echo %%~p>>"%GITHUB_PATH%"

      - name: Locate the ASIO SDK
        shell: cmd
        run: |
          set "ASIO=%CUERUNNER_ASIO_SDK%"
          if "%ASIO%"=="" if exist "C:\asio-sdk\ASIOSDK\common\asio.h" set "ASIO=C:\asio-sdk\ASIOSDK"
          if "%ASIO%"=="" (echo ::warning::No ASIO SDK found - set CUERUNNER_ASIO_SDK or unpack the SDK at C:\asio-sdk\ASIOSDK; the build will report ASIO as off. & exit /b 0)
          echo CUERUNNER_ASIO_SDK=%ASIO%>>"%GITHUB_ENV%"
          echo Using the ASIO SDK at %ASIO%

      - name: Integration (A&H through MIDI Control)
        env:
          AH_MIDI_PORT: ${{ vars.AH_MIDI_PORT || '' }}
          # The address the bridge dials, which the peer takes: it stands in for the desk, so
          # MIDI Control has to have been configured to reach it — 51325 is what both ranges
          # serve their own MIDI on.
          AH_DESK_TARGET: ${{ vars.AH_DESK_TARGET || '127.0.0.1:51325' }}
          AH_PROFILE: ${{ vars.AH_PROFILE || 'sq' }}
          # Left as the variable holds it, empty or not: the spec takes the range's own default
          # (1 for an SQ, 12 for an Avantis) unless a run has told it the desk is set otherwise.
          AH_MIDI_CHANNEL: ${{ vars.AH_MIDI_CHANNEL }}
        # Quoted for the reason the Eos job’s tag is: under `shell: pwsh` a bare `@ah` would
        # be read as a splat and the step would die before any test ran.
        run: npm run test:integration -- --grep "@ah"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-ah-results
          path: test-results/
          retention-days: 14
