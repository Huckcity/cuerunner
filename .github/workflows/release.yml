name: Release

# Deliberate, never automatic: pushing to main no longer publishes anything. Run this
# workflow from main (Actions → Release → Run workflow) when the release is wanted —
# semantic-release then cuts the version from the commits since the last tag, and
# build.yml picks it up from the published release. A run dispatched from any other ref
# fails semantic-release's own branch check rather than publishing.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ALSA dev headers
        run: sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
