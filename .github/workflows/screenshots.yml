name: Screenshots

# Takes the guide's figures on a hosted Linux runner and uploads them, for a person to look at and
# commit. Started by hand: `npm run screenshots` on a desk would take the desktop over.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: [ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Install runtime dependencies
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb

      - name: Capture
        run: xvfb-run -a npm run screenshots

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: website/assets/
          retention-days: 7
