name: Build

on:
  release:
    types: [published]
  workflow_dispatch:


# One run at a time, whatever the ref: every run writes the same `latest/` mirror, and two runs
# writing it together — a re-dispatch for an older tag beside a release still packaging — would
# let whichever finishes last delete the other's names. A group per ref would leave exactly that
# pair running side by side.
concurrency:
  group: build-latest
  cancel-in-progress: false

jobs:
  # A release runs on GitHub-hosted runners, like every workflow here. Its secrets are not given
  # to a fork's pull request, and only someone with write access can start this workflow.
  test:
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The pinned M4A helper only changes when its build script does.
      - name: Cache the packaged M4A decoder
        uses: actions/cache@v6
        with:
          path: native/audio/build/decoders
          key: ffmpeg-helper-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-linux.mjs') }}

      - name: Native acceptance (real mixer, offline render)
        run: npm run test:native

      - name: Typecheck
        run: npm run typecheck

      # The whole vitest run, and with it the two guards the release path waits on:
      # `scripts/docs-build.test.ts` holds every page the docs build generates to what the
      # renderer writes, and `scripts/published-numbers.test.ts` holds a published figure to
      # the run that produced it. Each packaging job below `needs` this one, so a release
      # cannot publish pages the render drifted from or numbers no run produced.
      - name: Unit tests
        run: npm test

  test-e2e:
    runs-on: [macos-15]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # No `playwright install`: every spec here drives the app's own Electron, so the
      # browser bundles the command downloads are never opened — and this lane gates all
      # three packaging jobs, which is no place for a download nothing uses.

      - name: E2E tests, first half
        run: npm run test:e2e -- --shard=1/2

      - name: E2E tests, second half
        run: npm run test:e2e -- --shard=2/2

  build-windows:
    needs: [ test, test-e2e ]
    runs-on: [windows-2025]
    # What this build is, for the release job's notes and for the file list the release page
    # and the mirror are composed from: the installer it published — empty when it published
    # none — whether a certificate signed it, and whether it linked the ASIO SDK. Every one
    # of them is recorded from the environment that produced it, the signing configuration
    # this run decided on and the SDK probe, never written into the notes by hand.
    outputs:
      installer: ${{ steps.publish.outputs.installer }}
      certificate: ${{ steps.publish.outputs.certificate }}
      asio: ${{ steps.publish.outputs.asio }}
      feed: ${{ steps.publish.outputs.feed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # dist:win builds the native playback engine, which needs a C++ toolchain in the
      # environment rather than only installed on the runner. Same import as ci.yml's E2E
      # lane, and the same reason for spelling it out: the action it used to call still
      # targets Node 20, and this is vswhere + vcvars64 + two variable files.
      - name: Set up MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (echo ::error::no Visual Studio with the C++ tools was found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>>"%GITHUB_ENV%"
          for %%p in ("%PATH:;=" "%") do echo %%~p>>"%GITHUB_PATH%"
          rem Last, so it comes first: Git for Windows also has a `link`, and it is not the linker.
          echo %VCToolsInstallDir%bin\Hostx64\x64>>"%GITHUB_PATH%"

      # The SDK is fetched from Steinberg for this build and never committed or uploaded: its licence
      # forbids redistributing it. Pinned by hash, so a changed download stops here. A failure is
      # a warning: the release then has no ASIO, and its notes say so.
      - name: Fetch the ASIO SDK from Steinberg
        shell: pwsh
        continue-on-error: true
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'asio-sdk.zip'
          Invoke-WebRequest -Uri 'https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'd5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca') { throw "the ASIO SDK download hashes to $hash" }
          New-Item -ItemType Directory -Force -Path 'C:\asio-sdk' | Out-Null
          Expand-Archive -Path $zip -DestinationPath 'C:\asio-sdk' -Force

      # ASIO is optional and the SDK behind it cannot be shipped with the repository
      # (Steinberg's licence forbids redistributing it): a runner that has an SDK builds
      # with ASIO, and one that does not builds without it — a warning here, not a
      # failure. scripts/asio-sdk.mjs reads CUERUNNER_ASIO_SDK and nothing else, so this is
      # the only place the path is decided: the variable a provisioned runner sets by
      # hand, then the documented default location.
      - name: Locate the ASIO SDK
        id: asio
        shell: cmd
        run: |
          set "ASIO=%CUERUNNER_ASIO_SDK%"
          if "%ASIO%"=="" if exist "C:\asio-sdk\ASIOSDK\common\asio.h" set "ASIO=C:\asio-sdk\ASIOSDK"
          if "%ASIO%"=="" (echo ::warning::No ASIO SDK found - set CUERUNNER_ASIO_SDK or unpack the SDK at C:\asio-sdk\ASIOSDK; the build will report ASIO as off. & echo found=no>>"%GITHUB_OUTPUT%" & exit /b 0)
          echo CUERUNNER_ASIO_SDK=%ASIO%>>"%GITHUB_ENV%"
          echo found=yes>>"%GITHUB_OUTPUT%"
          echo Using the ASIO SDK at %ASIO%

      # What this build signs with is decided here, once, and every other step in this job
      # asks: the packaging step takes the electron-builder flags this step prints, and the
      # recording takes the `yes`/`no` this step answers, so a build that signs nothing can
      # never be recorded as a build that signed. `scripts/trusted-signing.ts` is that
      # decision and `scripts/trusted-signing.test.ts` holds it to the four states an
      # environment can be in; this step is the plumbing around it.
      #
      # Azure Trusted Signing keeps the signing key in Azure, so the four resource identifiers
      # — the account, its certificate profile, the region's endpoint and the publisher the
      # certificate carries — are repository *variables* rather than secrets: they name the
      # service and authenticate nothing. The three Entra credentials the signer
      # authenticates with are the secrets. There is no certificate and no `.pfx` anywhere in
      # this repository, and nothing to expire or leak from it.
      #
      # macOS decides the same thing in `scripts/signing-env.sh`, which exports `CSC_LINK` for
      # a builder that treats an absent certificate as "do not sign". This one exports
      # nothing, because electron-builder's Windows signer does not: with
      # `win.azureSignOptions` configured it refuses to build at all when it cannot
      # authenticate (electron-builder#9623 is the upstream report), so a configuration that
      # is present without credentials is a failed build rather than an unsigned one. Asking
      # first, in one place, is what keeps a build with no identity a green build that says so.
      - name: Decide what this build can sign with
        id: signing
        shell: pwsh
        env:
          TRUSTED_SIGNING_PUBLISHER: ${{ vars.TRUSTED_SIGNING_PUBLISHER }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $plan = node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/trusted-signing.ts | ConvertFrom-Json
          if ($plan.error) {
            Write-Host "::error::$($plan.error)"
            exit 1
          }
          if ($plan.warning) {
            Write-Host "::warning::$($plan.warning)"
          }
          "signed=$($plan.signed)" >> $env:GITHUB_OUTPUT
          # The flags as one JSON array, so the packaging step hands each to electron-builder
          # as its own argument: a publisher name carries spaces and an `=`, and a
          # re-joined string would break it in two.
          "args=$(ConvertTo-Json -Compress -InputObject @($plan.args))" >> $env:GITHUB_OUTPUT

      # The engine is a separate binary; a build that ships one the user cannot identify
      # as theirs is a build a venue will refuse to install. The installer is signed by the
      # service the step above decided on, which is configured for this run only: the flags
      # arrive as electron-builder's own `-c.win.azureSignOptions.*` options, and with no
      # identity configured they are an empty array, so this is the same unsigned build the
      # release notes will name as unsigned.
      #
      # `shell: pwsh` is spelled out because it is what a Windows runner defaults to:
      # the POSIX `if [ -z ... ]` this step used to carry would die at its first line
      # there, and this is the step that builds the installer the release publishes.
      - name: Build and package
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # `@()` and the filter together, because an empty `[]` and a `$null` are not the same
          # thing to splat: this step has to hand electron-builder nothing at all when no
          # identity is configured, not one empty argument.
          $signArgs = @(ConvertFrom-Json '${{ steps.signing.outputs.args }}' | Where-Object { $_ })
          & npm run dist:win -- @signArgs

      # `midi` is an optional dependency, so a runner that cannot build it gives `npm ci` an
      # exit 0 and the packager an app with no MIDI in it: v0.16.0's Windows installer
      # shipped that way, and said "MIDI unavailable" on its first screen. The artifact is
      # what is checked — scripts/verify-packaged-midi.mjs carries the rest.
      - name: The packaged app carries the MIDI module
        run: node scripts/verify-packaged-midi.mjs dist

      # `secrets` is not available to a step's `if:` — GitHub rejects the whole workflow
      # when one is asked for there, and the run fails with no jobs and nothing to read.
      # The step runs, and decides for itself whether there is a signature to check: this is
      # the state the decision step answered, not the secrets behind it, so a build that was
      # configured to sign and produced nothing signed fails here.
      - name: Verify the signature
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          TRUSTED_SIGNING_PUBLISHER: ${{ vars.TRUSTED_SIGNING_PUBLISHER }}
        run: |
          if ($env:SIGNED -ne 'yes') {
            Write-Host 'No Trusted Signing identity is configured; nothing to verify.'
            exit 0
          }
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'no installer was built in dist\' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "$($installer.Name): $($signature.Status) — $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "the installer is not validly signed: $($signature.Status)"
          }
          # Valid is not the same as ours: the notes name this service, so the certificate
          # that signed the installer has to carry the publisher it was configured with.
          if (-not $signature.SignerCertificate.Subject.Contains($env:TRUSTED_SIGNING_PUBLISHER)) {
            throw "the installer is signed by $($signature.SignerCertificate.Subject), not by $env:TRUSTED_SIGNING_PUBLISHER"
          }

      # What this installer is, recorded for the release notes rather than described to them:
      # the certificate state comes from the decision the first step made, the ASIO half from
      # the probe above. The probe answers whether it found an SDK with `yes`/`no` — its own
      # contract — and the state this job publishes is the engine's own word for it, `on`/`off`,
      # which is what the release notes' composer and the build log both speak; the mapping
      # happens here and nowhere else. Steinberg's agreement is an external input this repository
      # cannot supply, so `native/audio/third_party/ASIO-AGREEMENT.md` is the record of it being
      # signed: its absence is the honest "not recorded" state this gate reads, and so is a file
      # that carries nothing, because the record the README and the checklist describe holds a
      # date and the parties. A build that links the SDK without a recorded agreement withholds
      # its installer — the job passes, the warning names the missing record, and nothing is
      # uploaded for a release to publish or a mirror to copy.
      - name: Record what this installer is
        id: publish
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ASIO: ${{ steps.asio.outputs.found }}
        run: |
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'no installer was built in dist\' }
          $certificate = if ($env:SIGNED -eq 'yes') { 'yes' } else { 'no' }
          $asio = if ($env:ASIO -eq 'yes') { 'on' } else { 'off' }
          $agreement = Get-Item native/audio/third_party/ASIO-AGREEMENT.md -ErrorAction SilentlyContinue
          $recorded = $null -ne $agreement -and $agreement.Length -gt 0
          $withheld = $asio -eq 'on' -and -not $recorded
          if ($withheld) {
            Write-Host "::warning::$($installer.Name) links Steinberg's ASIO SDK and native/audio/third_party/ASIO-AGREEMENT.md records no signed agreement: the installer is withheld from the release."
          }
          $published = if ($withheld) { '' } else { $installer.Name }
          # The update feed this installer is offered by: electron-builder's `latest.yml`, which
          # has to name the installer recorded here, or the app would be sent a file that is not
          # this one. It follows the installer — a withheld installer is offered by no feed.
          $feed = ''
          if ($published -ne '') {
            if (-not (Test-Path dist\latest.yml)) { throw 'electron-builder wrote no dist\latest.yml beside the installer' }
            if (-not (Select-String -Path dist\latest.yml -SimpleMatch -Quiet -Pattern "url: $published")) {
              throw "dist\latest.yml does not name $published, so it would offer a file this build did not make"
            }
            $feed = 'latest.yml'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "installer=$published"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "certificate=$certificate"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "asio=$asio"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "feed=$feed"

      - name: Upload installer
        if: steps.publish.outputs.installer != ''
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-windows
          path: dist/${{ steps.publish.outputs.installer }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the update feed
        if: steps.publish.outputs.feed != ''
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-windows-feed
          path: dist/${{ steps.publish.outputs.feed }}
          if-no-files-found: error
          retention-days: 30

  build-mac:
    needs: [ test, test-e2e ]
    runs-on: [macos-15]
    # The same recording as the Windows job's: the dmg this job published, and the two facts
    # the notes need — whether a certificate signed it, and whether the Apple credentials
    # notarised it. Both are read from the secrets that gate that work.
    outputs:
      dmg: ${{ steps.publish.outputs.dmg }}
      certificate: ${{ steps.publish.outputs.certificate }}
      notarised: ${{ steps.publish.outputs.notarised }}
      zip: ${{ steps.publish.outputs.zip }}
      feed: ${{ steps.publish.outputs.feed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # macOS needs both halves: the Developer ID certificate (`MAC_CSC_LINK` /
      # `MAC_CSC_KEY_PASSWORD`) to sign, and `APPLE_ID` + `APPLE_APP_SPECIFIC_PASSWORD` +
      # `APPLE_TEAM_ID` for electron-builder to notarise and staple, which is what makes
      # Gatekeeper open the app on a machine that has never seen it. The certificate is
      # exported by `scripts/signing-env.sh`, which is where the rule about empty secrets
      # lives and is tested; electron-builder would treat an empty CSC_LINK as a
      # certificate it cannot resolve rather than as "not signing".
      - name: Build and package
        env:
          SIGNING_LINK: ${{ secrets.MAC_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          . scripts/signing-env.sh
          npm run dist:mac

      # `midi` is an optional dependency, so a runner that cannot build it gives `npm ci` an
      # exit 0 and the packager an app with no MIDI in it: v0.16.0's Windows installer
      # shipped that way, and said "MIDI unavailable" on its first screen. The artifact is
      # what is checked — scripts/verify-packaged-midi.mjs carries the rest.
      - name: The packaged app carries the MIDI module
        run: node scripts/verify-packaged-midi.mjs dist

      # Same reason as the Windows step: the check lives in the shell, not in an `if:`.
      - name: Verify the floor, the signature and the notarisation ticket
        env:
          SIGNING_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          # The floor the package declares has to be the floor the bundle carries: this key is
          # what macOS reads to refuse to launch the app on an older system. It gates launching,
          # not installation, and it is checked before the certificate guard because it has
          # nothing to do with signing — an unsigned build still has a floor, and this step is
          # the only place the packaged plist is ever read.
          EXPECTED=$(node -p "require('./package.json').build.mac.minimumSystemVersion")
          ACTUAL=$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist" 2>/dev/null || true)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::$APP carries LSMinimumSystemVersion '$ACTUAL', not the '$EXPECTED' package.json declares"
            exit 1
          fi
          if [ -z "$SIGNING_LINK" ]; then
            echo 'No certificate configured; nothing to verify.'
            exit 0
          fi
          echo "verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Gatekeeper's own assessment: this is what a venue machine runs, and it fails
          # for an unnotarised build even when the signature itself is good.
          spctl --assess --type execute --verbose=2 "$APP"
          # electron-builder notarises the app inside the dmg, not the dmg itself. Apple only
          # issues a ticket for a container it has scanned, so the dmg must be submitted
          # before a ticket can be stapled to it — and the ticket has to travel with the file
          # a user downloads, not just with the app inside it.
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # The recording the Windows job does, from this platform's own secrets: `MAC_CSC_LINK`
      # decides whether the app is signed at all, and the three Apple credentials decide
      # whether it is also notarised — the state the notes must name, because an app that is
      # signed but not notarised is the one Gatekeeper refuses. Notarisation is derived with
      # the certificate rather than beside it, so a build with no certificate cannot record
      # itself notarised: nothing was submitted for a signature nobody had. A certificate with
      # no notarisation half never reaches this step — the verification above fails the job on
      # `spctl` and `stapler validate`, and nothing is uploaded.
      - name: Record what this build is
        id: publish
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no dmg was built in dist/"
            exit 1
          fi
          if [ -z "$MAC_CSC_LINK" ]; then
            certificate='no'
          else
            certificate='yes'
          fi
          if [ "$certificate" = 'yes' ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            notarised='yes'
          else
            notarised='no'
          fi
          # The update: macOS replaces an app from a zip of it rather than from the dmg, so the
          # zip is what `latest-mac.yml` offers, and the feed has to name the zip recorded here.
          ZIP=$(find dist -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::no zip was built in dist/, and the zip is what a Mac updates itself from"
            exit 1
          fi
          if [ ! -f dist/latest-mac.yml ] || ! grep -qF "url: $(basename "$ZIP")" dist/latest-mac.yml; then
            echo "::error::dist/latest-mac.yml does not name $(basename "$ZIP"), so it would offer a file this build did not make"
            exit 1
          fi
          {
            echo "dmg=$(basename "$DMG")"
            echo "certificate=$certificate"
            echo "notarised=$notarised"
            echo "zip=$(basename "$ZIP")"
            echo "feed=latest-mac.yml"
          } >> "$GITHUB_OUTPUT"

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-mac
          path: dist/${{ steps.publish.outputs.dmg }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the update
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-mac-update
          path: dist/${{ steps.publish.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the update feed
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-mac-feed
          path: dist/${{ steps.publish.outputs.feed }}
          if-no-files-found: error
          retention-days: 30

  build-linux:
    needs: [ test, test-e2e ]
    runs-on: [ubuntu-24.04]
    # The artifacts with no signature to record: this pipeline has no Linux signing step — and
    # adds none — so the AppImage and the .deb are named as what they are in the release job's
    # notes.
    outputs:
      appimage: ${{ steps.publish.outputs.appimage }}
      deb: ${{ steps.publish.outputs.deb }}
      feed: ${{ steps.publish.outputs.feed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache the packaged M4A decoder
        uses: actions/cache@v6
        with:
          path: native/audio/build/decoders
          key: ffmpeg-helper-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-linux.mjs') }}

      - name: Build and package
        run: npm run dist:linux

      # `midi` is an optional dependency, so a runner that cannot build it gives `npm ci` an
      # exit 0 and the packager an app with no MIDI in it: v0.16.0's Windows installer
      # shipped that way, and said "MIDI unavailable" on its first screen. The artifact is
      # what is checked — scripts/verify-packaged-midi.mjs carries the rest.
      - name: The packaged app carries the MIDI module
        run: node scripts/verify-packaged-midi.mjs dist

      # The AppImage is the artifact this pipeline cannot sign: there is no Linux signing step
      # above, and this story adds none — so there is no secret to read a state from, and the
      # release job's notes name this file unsigned on that ground. What keeps the sentence true
      # is `scripts/release-path.test.ts`, which holds this job to naming no signing tool or
      # secret at all — `CSC_LINK`, `codesign`, `spctl`, `stapler`, `notarytool`, `cosign`,
      # `gpg`, `sigstore`, `osslsigncode`, a `--sign` flag — with the comments in it left out of
      # that reading, so explaining the absence of a step does not fail it.
      - name: Record what this build is
        id: publish
        run: |
          APPI=$(find dist -maxdepth 1 -name '*.AppImage' | head -1)
          if [ -z "$APPI" ]; then
            echo "::error::no AppImage was built in dist/"
            exit 1
          fi
          # The .deb beside it, for the machines a package manager keeps: it names the libraries
          # the AppImage cannot ask for (scripts/linux-packages.test.ts), and it cannot replace
          # itself, so the app sends a .deb install to the download page when there is a newer one.
          DEB=$(find dist -maxdepth 1 -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::no .deb was built in dist/"
            exit 1
          fi
          # The update feed: `latest-linux.yml` has to name the AppImage recorded here, which is
          # the Linux build that replaces itself.
          if [ ! -f dist/latest-linux.yml ] || ! grep -qF "url: $(basename "$APPI")" dist/latest-linux.yml; then
            echo "::error::dist/latest-linux.yml does not name $(basename "$APPI"), so it would offer a file this build did not make"
            exit 1
          fi
          echo "appimage=$(basename "$APPI")" >> "$GITHUB_OUTPUT"
          echo "deb=$(basename "$DEB")" >> "$GITHUB_OUTPUT"
          echo "feed=latest-linux.yml" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-linux
          path: dist/${{ steps.publish.outputs.appimage }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-linux-deb
          path: dist/${{ steps.publish.outputs.deb }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload the update feed
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-linux-feed
          path: dist/${{ steps.publish.outputs.feed }}
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [ build-windows, build-mac, build-linux ]
    # Nothing publishes from a ref that is not a tag: a dispatch from a branch may package —
    # that is how this path is exercised without publishing — but it can neither manufacture a
    # release nor overwrite `latest/`. `success()` stays in the condition on purpose: a
    # packaging job that failed leaves its recording unset, and a release composed without one
    # would be a page its own notes cannot describe.
    if: github.ref_type == 'tag' && success()
    runs-on: [ubuntu-24.04]
    # The lists the release page and the R2 mirror each read, composed once, below.
    outputs:
      files: ${{ steps.notes.outputs.files }}
      mirror: ${{ steps.notes.outputs.mirror }}
      feed: ${{ steps.notes.outputs.feed }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The notes, the file list and the digests are composed together, from what each packaging
      # job recorded: whether a certificate signed an installer comes from the configuration
      # that gated that build — the Trusted Signing identity on Windows, the certificate
      # secret on macOS — and whether the Windows build linked the SDK comes from its probe,
      # never from text written here. One recording decides what this page carries, what the
      # notes say about it, what the mirror copies and what the digests name, so they cannot
      # disagree.
      - name: Compose the state section and the file list
        id: notes
        env:
          WINDOWS_INSTALLER: ${{ needs.build-windows.outputs.installer }}
          WINDOWS_CERTIFICATE: ${{ needs.build-windows.outputs.certificate }}
          WINDOWS_ASIO: ${{ needs.build-windows.outputs.asio }}
          MAC_DMG: ${{ needs.build-mac.outputs.dmg }}
          MAC_CERTIFICATE: ${{ needs.build-mac.outputs.certificate }}
          MAC_NOTARISED: ${{ needs.build-mac.outputs.notarised }}
          LINUX_APPIMAGE: ${{ needs.build-linux.outputs.appimage }}
          WINDOWS_FEED: ${{ needs.build-windows.outputs.feed }}
          MAC_ZIP: ${{ needs.build-mac.outputs.zip }}
          MAC_FEED: ${{ needs.build-mac.outputs.feed }}
          LINUX_DEB: ${{ needs.build-linux.outputs.deb }}
          LINUX_FEED: ${{ needs.build-linux.outputs.feed }}
        run: |
          set -eu

          # This run's own files, created rather than appended to: a reused workspace
          # can still hold the previous run's notes, list and digests, and what is published has
          # to be what this run recorded.
          : > release-notes.md
          : > release-files.txt
          : > release-feed.txt
          : > SHA256SUMS

          # The path the download step left a recorded file at. A name no artifact holds is a
          # failure rather than a missing line: one recording decides the notes, the release
          # page and the mirror, and a list that quietly drops an artifact is how the three
          # start saying different things.
          located() {
            found=$(find artifacts -type f -name "$1" -print -quit)
            if [ -z "$found" ]; then
              # stderr, not stdout: this function is called with its standard output going
              # into the file list, and an error message must not become a line of it.
              echo "::error::$2 recorded the file $1, and the artifacts this run downloaded hold no file by that name" >&2
              exit 1
            fi
            printf '%s\n' "$found"
          }

          # One artifact: the sentence the notes carry about it, the path the release page and
          # the mirror take it from, and its digest — added together, so neither surface can
          # name what the other does not, the notes cannot describe a file this release does not
          # carry, and the sums file cannot name bytes this run never published.
          publish() {
            printf -- '- %s\n' "$2" >> release-notes.md
            found=$(located "$1" "$3")
            printf '%s\n' "$found" >> release-files.txt
            # `sha256sum` writes coreutils' own `<digest>  <name>` line for the file in its own
            # directory, under the basename the release page carries it by: the digest is read
            # from the bytes this run located, never typed, and a reader can check the file they
            # downloaded against the line attached beside the notes.
            (cd "$(dirname "$found")" && sha256sum "$(basename "$found")") >> SHA256SUMS
          }

          # One file the app's update check reads — a platform's `latest*.yml`, or the macOS zip
          # it names — carried on the release page with its digest like every other file, and
          # listed for the mirror's feed rather than its download cards: no user is handed one.
          # A feed is only ever recorded beside the installer it offers, so one with no
          # installer is a recording that contradicts itself.
          feed() {
            found=$(located "$1" "$2")
            printf '%s\n' "$found" >> release-feed.txt
            (cd "$(dirname "$found")" && sha256sum "$(basename "$found")") >> SHA256SUMS
          }

          # The section itself, appended to semantic-release's body: it says where the states
          # below come from and which run wrote it — a second dispatch appends a second section,
          # and a reader has to be able to tell which described which artifacts.
          cat >> release-notes.md <<SECTION

          ---

          ### What each installer is

          Composed by the run that built these files —
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — from what its jobs
          recorded: the signing configuration each build was given, and the ASIO SDK probe. So an
          installer nobody signed says so here, and the files this page carries, and the ones the
          download mirror serves, are exactly the list below — the \`SHA256SUMS\` attached beside
          them carries each file's digest, so a download can be checked against this page.

          SECTION

          if [ -n "$WINDOWS_INSTALLER" ]; then
            case "$WINDOWS_CERTIFICATE" in
              yes) windows='signed by Azure Trusted Signing, and verified by the build with `Get-AuthenticodeSignature`' ;;
              no) windows='unsigned: no Azure Trusted Signing identity is configured, so Windows warns about this installer and a venue machine will refuse it' ;;
              *)
                echo "::error::build-windows recorded the certificate state \"$WINDOWS_CERTIFICATE\", which is neither yes nor no; the notes are composed from that recording and cannot be written from one they do not understand"
                exit 1
                ;;
            esac
            case "$WINDOWS_ASIO" in
              on) windows="$windows. It links Steinberg's ASIO SDK, which the signed agreement \`native/audio/third_party/ASIO-AGREEMENT.md\` records." ;;
              off) windows="$windows. It was built without Steinberg's ASIO SDK, so it hosts no ASIO driver." ;;
              *)
                echo "::error::build-windows recorded the ASIO state \"$WINDOWS_ASIO\", which is neither on nor off"
                exit 1
                ;;
            esac
            publish "$WINDOWS_INSTALLER" "**Windows**: \`$WINDOWS_INSTALLER\` — $windows" 'build-windows'
            if [ -z "$WINDOWS_FEED" ]; then
              echo '::error::build-windows published an installer and recorded no update feed for it, so the app would never be offered it'
              exit 1
            fi
            feed "$WINDOWS_FEED" 'build-windows'
          elif [ "$WINDOWS_ASIO" = 'on' ]; then
            withheld="- **Windows**: no installer is published. This build linked Steinberg's ASIO SDK and \`native/audio/third_party/ASIO-AGREEMENT.md\` records no signed agreement, which is what publishing a build against the SDK requires — so the installer is withheld from this page, and the download mirror removes the name the Windows card points at: that card answers 404 until a release carries the file again."
            printf -- '%s\n' "$withheld" >> release-notes.md
          else
            echo '::error::build-windows published no installer without the ASIO SDK being on, and nothing in this run explains that: no release is composed from a recording that contradicts itself'
            exit 1
          fi

          case "$MAC_CERTIFICATE:$MAC_NOTARISED" in
            no:*)
              mac='unsigned: no macOS certificate is configured, so the app is neither signed nor notarised and Gatekeeper refuses it on a machine that has not seen it.'
              ;;
            yes:yes)
              mac='signed and notarised with the certificate and the Apple credentials in the release secrets, verified with `codesign`, `spctl` and `stapler validate`.'
              ;;
            yes:no)
              echo '::error::build-mac recorded a certificate with no notarisation credentials: an app that is signed but not notarised is the one Gatekeeper refuses, and that job fails such a build at verification rather than uploading it'
              exit 1
              ;;
            *)
              echo "::error::build-mac recorded the certificate state \"$MAC_CERTIFICATE\" and the notarisation state \"$MAC_NOTARISED\", which are not states this pipeline reads"
              exit 1
              ;;
          esac
          publish "$MAC_DMG" "**macOS**: \`$MAC_DMG\` — $mac" 'build-mac'
          if [ -z "$MAC_ZIP" ] || [ -z "$MAC_FEED" ]; then
            echo '::error::build-mac published a dmg and recorded no update zip or feed beside it, so a Mac would never be offered this release'
            exit 1
          fi
          feed "$MAC_ZIP" 'build-mac'
          feed "$MAC_FEED" 'build-mac'

          publish "$LINUX_APPIMAGE" "**Linux**: \`$LINUX_APPIMAGE\` — unsigned: this pipeline has no Linux signing step, so nothing signs the AppImage and nothing here claims otherwise." 'build-linux'
          publish "$LINUX_DEB" "**Linux (Debian, Ubuntu)**: \`$LINUX_DEB\` — unsigned like the AppImage, for the same reason. A .deb does not replace itself: the app says when there is a newer one and sends the operator to the download page." 'build-linux'
          if [ -z "$LINUX_FEED" ]; then
            echo '::error::build-linux published an AppImage and recorded no update feed for it, so the app would never be offered it'
            exit 1
          fi
          feed "$LINUX_FEED" 'build-linux'

          # What the update files are, in one line: the app reads them, and the mirror points each
          # at this release's own folder.
          if [ -s release-feed.txt ]; then
            named=$(while IFS= read -r file; do printf '`%s` ' "$(basename "$file")"; done < release-feed.txt)
            printf -- '- **Updates**: %s— what the app'"'"'s update check reads. Each feed names its installer with the SHA-512 the app checks the download against before installing anything, and the download mirror serves the feeds under `latest/` pointing at this release'"'"'s own `versions/` folder.\n' "$named" >> release-notes.md
          fi

          if [ ! -s release-files.txt ]; then
            echo '::error::no artifact was published, so there is no release to describe and nothing to mirror'
            exit 1
          fi

          # Three lists off the one recording: what the release page carries — the located files,
          # the update feed and the sums file composed from them — what the mirror copies to the
          # names its cards link, the located installers alone, and the feed the mirror serves to
          # the app. The mirror is handed its own lists because it writes its own names and
          # composes its own sums under them, and because a list naming a file no suffix places is
          # how a mirror comes to carry something the release page does not.
          {
            printf 'body=release-notes.md\n'
            printf 'files<<RELEASE_FILES\n'
            cat release-files.txt
            cat release-feed.txt
            printf '%s\n' SHA256SUMS
            printf 'RELEASE_FILES\n'
            printf 'mirror<<RELEASE_MIRROR\n'
            cat release-files.txt
            printf 'RELEASE_MIRROR\n'
            printf 'feed<<RELEASE_FEED\n'
            cat release-feed.txt
            printf 'RELEASE_FEED\n'
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          # Appended, not written: semantic-release owns the body — the commits since the last
          # tag — and this adds what the run recorded to it.
          body_path: ${{ steps.notes.outputs.body }}
          append_body: true
          # The composed list: the page carries the artifacts the notes describe and no others.
          files: ${{ steps.notes.outputs.files }}
          fail_on_unmatched_files: true

  upload-r2:
    needs: release
    # The same gate as the release job's, for the same reason: `latest/` is what the site's
    # download cards point at, and a branch dispatch must not overwrite it.
    if: github.ref_type == 'tag' && success()
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          TAG: ${{ github.ref_name }}
          FILES: ${{ needs.release.outputs.mirror }}
          FEED: ${{ needs.release.outputs.feed }}
        run: |
          set -eu
          # The list the notes were composed from, copied file by file. There is no search
          # here on purpose: a `find artifacts -name '*.exe'` would be a second list, and a
          # second list is how the mirror comes to carry an installer the release withheld.
          #
          # The site's download cards name these three files, so the mirror keeps its own names
          # whatever the build called them; one universal dmg, because the stapler validates
          # the file that ships rather than one architecture of two. The names are declared once,
          # as suffix→name pairs: the copy loop's `case` resolves a file through them and the
          # removals below read the same pairs, so a rename cannot land on one half alone.
          NAMES='exe=Cuerunner-Setup.exe dmg=Cuerunner.dmg AppImage=Cuerunner.AppImage deb=Cuerunner.deb'

          # The update files no card links, declared the same way: the macOS zip a Mac replaces
          # itself from. The `latest*.yml` feeds keep their own names, which is where the app
          # looks for them.
          UPDATES='zip=Cuerunner-mac.zip'

          # This run's own sums file, created rather than appended to: a reused workspace can
          # still hold the previous run's digests, and what a user checks has to be what this
          # run copied.
          : > SHA256SUMS

          published=''
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            name=''
            for pair in $NAMES; do
              case "$file" in
                *."${pair%%=*}") name="${pair#*=}" ;;
              esac
            done
            if [ -z "$name" ]; then
              echo "::error::$file is published under a name this mirror cannot place"
              exit 1
            fi
            # A version's own name never changes meaning, so it may be cached for as long as a
            # client likes; `latest/` is the name every card hands out and it is overwritten by
            # the next release, so it is short-lived. Both are stated by the copy: nothing else
            # in this repository (or at the mirror) sets a caching header, and a CDN in front of
            # the bucket keeps whatever it was first told.
            aws s3 cp "$file" "s3://$R2_BUCKET/versions/$TAG/$name" \
              --cache-control "public, max-age=31536000, immutable" --endpoint-url "$R2_ENDPOINT"
            aws s3 cp "$file" "s3://$R2_BUCKET/latest/$name" \
              --cache-control "public, max-age=300" --endpoint-url "$R2_ENDPOINT"
            # The user's digests, composed from the bytes just copied and under the name this
            # mirror wrote them by: the file a card hands out is the file these lines name, and a
            # file the copy did not reach fails here rather than leaving a short list.
            digest=$(sha256sum "$file")
            printf '%s  %s\n' "${digest%% *}" "$name" >> SHA256SUMS
            published="$published $name"
          done <<< "$FILES"

          # Every name this mirror writes that the list did not carry stops being served here: a
          # release that withheld an installer must not leave an earlier release's file standing
          # under this release's name for a card to hand out, and the 404 is what the notes
          # explain. A key this step does not write — an older name the bucket still holds — is
          # neither copied nor removed. S3's DELETE answers success for a key that is not there,
          # so this needs no listing and a name no release ever published is not an error; the
          # token has to permit delete, and a refusal fails the step rather than leaving the
          # earlier release's file in place.
          for pair in $NAMES; do
            name="${pair#*=}"
            case " $published " in
              *" $name "*) continue ;;
            esac
            aws s3 rm "s3://$R2_BUCKET/latest/$name" --endpoint-url "$R2_ENDPOINT"
          done

          # The update feed, after every installer it can name is in place. A file a feed offers
          # is copied under this release's own `versions/` folder only — never `latest/`, which the
          # next release overwrites while a machine may be halfway through downloading it — and
          # each feed is rewritten so every file it names is that copy, by the name this mirror
          # wrote it under, before it is served from `latest/`, where the app looks. The SHA-512 a
          # feed carries is electron-builder's digest of the bytes, which a copy does not change,
          # so the app checks what it downloads against the build that made it. A feed naming a
          # file this run did not write fails here rather than offering a 404. The release notes
          # inside a feed are left as they are: only the entries above them name files.
          written=" $published "
          : > feeds.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              *.yml)
                printf '%s\n' "$file" >> feeds.txt
                continue
                ;;
            esac
            name=''
            for pair in $UPDATES; do
              case "$file" in
                *."${pair%%=*}") name="${pair#*=}" ;;
              esac
            done
            if [ -z "$name" ]; then
              echo "::error::$file is in the update feed under a name this mirror cannot place"
              exit 1
            fi
            aws s3 cp "$file" "s3://$R2_BUCKET/versions/$TAG/$name" \
              --cache-control "public, max-age=31536000, immutable" --endpoint-url "$R2_ENDPOINT"
            written="$written$name "
          done <<< "$FEED"

          # Where a file a feed names was written: `../versions/<tag>/<name>`, relative to the
          # `latest/` the feed is served from, or nothing when this run wrote no such name.
          placed() {
            for pair in $NAMES $UPDATES; do
              case "$1" in
                *."${pair%%=*}")
                  case "$written" in
                    *" ${pair#*=} "*) printf '../versions/%s/%s\n' "$TAG" "${pair#*=}"; return 0 ;;
                  esac
                  ;;
              esac
            done
            return 1
          }

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            served="feed-$(basename "$file")"
            : > "$served"
            entries=1
            while IFS= read -r line || [ -n "$line" ]; do
              # A top-level key ends the entries' part of the file or carries on with it: the
              # notes are a block of their own, and nothing in them is a file this mirror wrote.
              case "$line" in
                releaseNotes:*) entries=0 ;;
                [A-Za-z]*) entries=1 ;;
              esac
              if [ "$entries" = 1 ] && [[ $line =~ ^([[:space:]]*(-[[:space:]]+)?(url|path):[[:space:]]+)(.+)$ ]]; then
                value="${BASH_REMATCH[4]}"
                value="${value#\'}"
                value="${value%\'}"
                value="${value#\"}"
                value="${value%\"}"
                if ! target=$(placed "$value"); then
                  echo "::error::$file offers $value, which this run did not write to the mirror"
                  exit 1
                fi
                printf '%s%s\n' "${BASH_REMATCH[1]}" "$target" >> "$served"
              else
                printf '%s\n' "$line" >> "$served"
              fi
            done < "$file"
            aws s3 cp "$served" "s3://$R2_BUCKET/versions/$TAG/$(basename "$file")" \
              --cache-control "public, max-age=31536000, immutable" --endpoint-url "$R2_ENDPOINT"
            aws s3 cp "$served" "s3://$R2_BUCKET/latest/$(basename "$file")" \
              --cache-control "public, max-age=300" --endpoint-url "$R2_ENDPOINT"
          done < feeds.txt

          # Last, so that the served digests and the served names agree: a refused removal fails
          # the step above with the previous release's `latest/SHA256SUMS` still standing beside
          # the name it does not match, rather than a new sums file naming files this run deleted.
          # The digests are read by whoever checks a download, so they carry `latest/`'s own
          # short lifetime rather than a version's.
          aws s3 cp SHA256SUMS "s3://$R2_BUCKET/latest/SHA256SUMS" \
            --cache-control "public, max-age=300" --endpoint-url "$R2_ENDPOINT"
