name: Build

on:
  release:
    types: [published]
  workflow_dispatch:


jobs:
  # A release runs entirely on the homelab machines, like every other workflow here:
  # Linux and the packaging on ubox, the macOS half on the Mac mini, the Windows installer
  # on the NUC (CLAUDE.md → CI runners). Nothing publishes from GitHub's runners, and
  # nothing here waits on them.
  test:
    runs-on: [self-hosted, linux, x64, ubox]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        # Already on the homelab runner, and that host has one dpkg lock for six jobs.
        run: |
          dpkg -s libasound2-dev >/dev/null 2>&1 ||
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y libasound2-dev

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The pinned M4A helper only changes when its build script does.
      - name: Cache the packaged M4A decoder
        uses: actions/cache@v6
        with:
          path: native/audio/build/decoders
          key: ffmpeg-helper-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-linux.mjs') }}

      - name: Native acceptance (real mixer, offline render)
        run: npm run test:native

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  test-e2e:
    runs-on: [self-hosted, macos, arm64, mac-mini]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # No `playwright install`: every spec here drives the app's own Electron, so the
      # browser bundles the command downloads are never opened — and this lane gates all
      # three packaging jobs, which is no place for a download nothing uses.

      - name: E2E tests
        run: npm run test:e2e

  build-windows:
    needs: [ test, test-e2e ]
    runs-on: [self-hosted, windows, x64, win-ci]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # dist:win builds the native playback engine, which needs a C++ toolchain in the
      # environment rather than only installed on the runner. Same import as ci.yml's E2E
      # lane, and the same reason for spelling it out: the action it used to call still
      # targets Node 20, and this is vswhere + vcvars64 + two variable files.
      - name: Set up MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (echo ::error::no Visual Studio with the C++ tools was found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>>"%GITHUB_ENV%"
          for %%p in ("%PATH:;=" "%") do echo %%~p>>"%GITHUB_PATH%"

      # ASIO is optional and the SDK behind it cannot be shipped with the repository
      # (Steinberg's licence forbids redistributing it): a runner that has an SDK builds
      # with ASIO, and one that does not builds without it — a warning here, not a
      # failure. scripts/asio-sdk.mjs reads CUERUNNER_ASIO_SDK and nothing else, so this is
      # the only place the path is decided: the variable a provisioned runner sets by
      # hand, then the documented default location.
      - name: Locate the ASIO SDK
        shell: cmd
        run: |
          set "ASIO=%CUERUNNER_ASIO_SDK%"
          if "%ASIO%"=="" if exist "C:\asio-sdk\ASIOSDK\common\asio.h" set "ASIO=C:\asio-sdk\ASIOSDK"
          if "%ASIO%"=="" (echo ::warning::No ASIO SDK found - set CUERUNNER_ASIO_SDK or unpack the SDK at C:\asio-sdk\ASIOSDK; the build will report ASIO as off. & exit /b 0)
          echo CUERUNNER_ASIO_SDK=%ASIO%>>"%GITHUB_ENV%"
          echo Using the ASIO SDK at %ASIO%

      # The engine is a separate binary; a build that ships one the user cannot identify
      # as theirs is a build a venue will refuse to install. Signing happens when the
      # release secrets exist — `WIN_CSC_LINK` (the certificate, base64 or a path) and
      # `WIN_CSC_KEY_PASSWORD` — and electron-builder skips it, without failing, when
      # they are empty: its Windows signer checks for the empty string, which is why this
      # job needs none of `scripts/signing-env.sh`.
      - name: Build and package
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::warning::No Windows certificate is configured (WIN_CSC_LINK); the installer will be unsigned."
          fi
          npm run dist:win

      # `secrets` is not available to a step's `if:` — GitHub rejects the whole workflow
      # when one is asked for there, and the run fails with no jobs and nothing to read.
      # The step runs, and decides for itself whether there is a signature to check.
      - name: Verify the signature
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if (-not $env:WIN_CSC_LINK) {
            Write-Host 'No certificate configured; nothing to verify.'
            exit 0
          }
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "$($installer.Name): $($signature.Status) — $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "the installer is not validly signed: $($signature.Status)"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-windows
          path: dist/*.exe
          retention-days: 30

  build-mac:
    needs: [ test, test-e2e ]
    runs-on: [self-hosted, macos, arm64, mac-mini]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # macOS needs both halves: the Developer ID certificate (`MAC_CSC_LINK` /
      # `MAC_CSC_KEY_PASSWORD`) to sign, and `APPLE_ID` + `APPLE_APP_SPECIFIC_PASSWORD` +
      # `APPLE_TEAM_ID` for electron-builder to notarise and staple, which is what makes
      # Gatekeeper open the app on a machine that has never seen it. The certificate is
      # exported by `scripts/signing-env.sh`, which is where the rule about empty secrets
      # lives and is tested; electron-builder would treat an empty CSC_LINK as a
      # certificate it cannot resolve rather than as "not signing".
      - name: Build and package
        env:
          SIGNING_LINK: ${{ secrets.MAC_CSC_LINK }}
          SIGNING_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          . scripts/signing-env.sh
          npm run dist:mac

      # Same reason as the Windows step: the check lives in the shell, not in an `if:`.
      - name: Verify the signature and the notarisation ticket
        env:
          SIGNING_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -z "$SIGNING_LINK" ]; then
            echo 'No certificate configured; nothing to verify.'
            exit 0
          fi
          APP=$(find dist -maxdepth 3 -name '*.app' -type d | head -1)
          echo "verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Gatekeeper's own assessment: this is what a venue machine runs, and it fails
          # for an unnotarised build even when the signature itself is good.
          spctl --assess --type execute --verbose=2 "$APP"
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          xcrun stapler validate "$DMG"

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-mac
          path: dist/*.dmg
          retention-days: 30

  build-linux:
    needs: [ test, test-e2e ]
    runs-on: [self-hosted, linux, x64, ubox]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        # Already on the homelab runner, and that host has one dpkg lock for six jobs.
        run: |
          dpkg -s libasound2-dev >/dev/null 2>&1 ||
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y libasound2-dev

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache the packaged M4A decoder
        uses: actions/cache@v6
        with:
          path: native/audio/build/decoders
          key: ffmpeg-helper-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-linux.mjs') }}

      - name: Build and package
        run: npm run dist:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Cuerunner-linux
          path: dist/*.AppImage
          retention-days: 30

  release:
    needs: [ build-windows, build-mac, build-linux ]
    runs-on: [self-hosted, linux, x64, ubox]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*

  upload-r2:
    needs: release
    runs-on: [self-hosted, linux, x64, ubox]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          # One universal dmg now: every Mac takes the same file, and the stapler
          # validates the file that ships rather than one architecture of two.
          DMG=$(find artifacts -name "*.dmg" | head -1)
          APPI=$(find artifacts -name "*.AppImage" | head -1)
          aws s3 cp "$EXE" "s3://$R2_BUCKET/versions/$TAG/WinsLab-Setup.exe" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$DMG" "s3://$R2_BUCKET/versions/$TAG/WinsLab.dmg"       --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$APPI" "s3://$R2_BUCKET/versions/$TAG/WinsLab.AppImage"  --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$EXE" "s3://$R2_BUCKET/latest/WinsLab-Setup.exe"        --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$DMG" "s3://$R2_BUCKET/latest/WinsLab.dmg"              --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$APPI" "s3://$R2_BUCKET/latest/WinsLab.AppImage"        --endpoint-url "$R2_ENDPOINT"
