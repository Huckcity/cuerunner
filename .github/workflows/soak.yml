name: Soak

# The reliability claim, checked rather than asserted: eight hours of show time on the
# silent pacer, in eight independent one-hour shards (a GitHub job may not run longer
# than six hours, and eight jobs that fail separately are more useful than one that
# times out). The `faults` job is the other half — the kill tests that assert what the
# app does when something dies underneath it.
#
# Scheduled runs are on the default branch only. `minutes` scales the show the night paces, and
# the shards are independent.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Show minutes per shard'
        default: '60'
      channels:
        description: 'Output channels per shard (2 = a stereo desk)'
        default: '2'


concurrency:
  # Shared with `ci.yml`'s native lane (group names are unique per repository, so the two
  # exclude each other). A workflow run holds its group from start to finish, which is what
  # keeps a night and a native-engine job off the host at the same time — the 2026-09-27 xrun
  # was measured beside a concurrent CI burst — while the eight shards *inside* the night still
  # run together, because a night's numbers are meant to be the engine under load. Named for
  # what it protects rather than for the workflow: `soak` alone said only who *else* it was
  # serialising against.
  group: timing-sensitive
  cancel-in-progress: false

jobs:
  soak:
    runs-on: [ubuntu-24.04]
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Build the engine
        run: node scripts/ensure-native.mjs

      # Shard 1 of 8 runs on eight channels instead of two: the same show through the
      # matrix path, so the routing code sees the nightly too.
      - name: Soak (shard ${{ matrix.shard }} of 8)
        run: |
          node native/audio/tests/soak.mjs \
            --shard ${{ matrix.shard }} --shards 8 \
            --minutes ${{ github.event.inputs.minutes || '60' }} \
            --channels ${{ matrix.shard == 1 && '8' || github.event.inputs.channels || '2' }} \
            --report soak-shard-${{ matrix.shard }}.json

      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-shard-${{ matrix.shard }}
          path: soak-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  # Kill tests: the app must behave when the world does not. Renderer killed mid-show,
  # engine killed mid-show, device taken away mid-show, a reader that cannot keep up —
  # each asserts a defined behaviour rather than an absence of crashing, and the native
  # half of it (stalled streams, a lost device, malformed media) runs on every pull
  # request too. This job is what keeps them honest over time.
  faults:
    runs-on: [ubuntu-24.04]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev

      - run: npm ci --legacy-peer-deps

      - name: Cache the packaged M4A decoder (pinned FFmpeg release build)
        uses: actions/cache@v6
        with:
          path: native/audio/build/decoders
          key: ffmpeg-helper-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-linux.mjs') }}

      - name: Install runtime dependencies
        run: |
          npx playwright install-deps
          sudo apt-get install -y xvfb

      # Same reason as the E2E lane in ci.yml: the kernel and the media libraries are a
      # Chromium process's minimum, the host is provisioned with them once, and this says
      # it still is. `npx playwright install-deps` is how GitHub's runners get them.

      - name: Native acceptance, including the fault injection
        run: npm run test:native

      - name: Kill tests (renderer, engine, device, media)
        run: npm run test:e2e -- e2e/engine-restart.spec.ts e2e/reliability.spec.ts e2e/durability.spec.ts e2e/device-loss.spec.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: soak-faults-results
          path: test-results/
          retention-days: 30

  report:
    needs: [soak, faults]
    if: always()
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: soak-shard-*
          path: artifacts
          merge-multiple: true

      - name: Fan in the shards
        run: |
          node scripts/soak-report.mjs \
            --reports artifacts \
            --out soak-latest.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --allow-missing

      # The night failed if any shard failed or the kill tests did. The report is
      # published either way — a red result is a result, and it is the one worth seeing.
      - name: Fail the run if the night was not clean
        if: needs.soak.result != 'success' || needs.faults.result != 'success'
        run: |
          echo "::error::soak night not clean — soak: ${{ needs.soak.result }}, faults: ${{ needs.faults.result }}"
          exit 1

      - name: Upload the night's result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-latest
          path: soak-latest.json
          retention-days: 90

  # The numbers on the website are the numbers from the last run that finished, so the
  # page cannot be older than the last night. The site itself is whatever is on main.
  publish:
    needs: [report]
    # A red night is the one worth publishing, and `report` fails exactly then — so
    # `success()` is what must not be asked for here. A cancelled run is still skipped:
    # its report says only that no shard reported, and that would overwrite a real night.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: soak-latest
          path: result

      - name: Put the result with the site
        run: cp result/soak-latest.json website/soak-latest.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
