name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [ubuntu-24.04]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The pages are generated: the modules under `website/docs/` are the source, and the
      # `.html` beside them is written by `node website/build-docs.mjs`. `ci.yml` runs on pull
      # requests only, so a direct push to `main` reached this job with nothing having checked
      # that the pages are the ones their sources write. That is the one thing this job can
      # know on its own, and it is the failure that matters here: a module edited without the
      # build would serve the old words under a new commit. (Whether a change *should* have
      # been pushed at all is branch protection's business, not this workflow's.)
      - name: The served pages are what their sources write
        run: |
          node website/build-docs.mjs
          if ! git diff --quiet -- website; then
            echo "::error::the site's pages are out of date with their sources — run node website/build-docs.mjs and commit the result"
            git --no-pager diff --stat -- website
            exit 1
          fi
          echo 'the served pages match their sources'

      # The reliability page reads ./soak-latest.json, which only the soak workflow
      # publishes — a website-only deploy would otherwise blank its figures until the
      # next nightly. Restore the live file first; a first-ever deploy simply has none.
      - name: Restore the published soak figures
        run: |
          curl -fsSL -o website/soak-latest.json https://cuerunner.app/soak-latest.json \
            || echo 'no published soak figures yet; the reliability page shows its empty state'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
