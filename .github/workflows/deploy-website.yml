name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, ubox]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The reliability page reads ./soak-latest.json, which only the soak workflow
      # publishes — a website-only deploy would otherwise blank its figures until the
      # next nightly. Restore the live file first; a first-ever deploy simply has none.
      - name: Restore the published soak figures
        run: |
          curl -fsSL -o website/soak-latest.json https://cuerunner.app/soak-latest.json \
            || echo 'no published soak figures yet; the reliability page shows its empty state'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
