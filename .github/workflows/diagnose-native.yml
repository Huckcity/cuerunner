# Throwaway: the two macOS-native cases, run on the Mac with the engine's own output visible.
# Dispatched by hand while they are understood rather than fixed; deleted once they are.
name: Diagnose native cases
on:
  workflow_dispatch:
jobs:
  mac:
    runs-on: [self-hosted, macos, arm64, mac-mini]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --legacy-peer-deps
      - name: The two cases, verbose, with the services' own output
        run: npx vitest run src/main/desk/SqNativeEngine.test.ts src/main/midi/MidiTcpEngine.test.ts --reporter=verbose
