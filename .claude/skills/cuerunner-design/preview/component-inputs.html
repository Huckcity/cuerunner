<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #1a1d22; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  label { width: 90px; flex-shrink: 0; font-size: 11px; color: #a3adb8; text-align: right; }
  input[type=text], input[type=number], select, textarea {
    flex: 1; background: #272c33; border: 1px solid #3b424c; border-radius: 3px;
    color: #eef1f4; font-size: 12px; padding: 4px 7px; height: 26px; outline: none;
    font-family: inherit;
  }
  input.focused { border-color: #5aa9ff; }
  input.name-edit { background: #12243a; border-color: #5aa9ff; }
  textarea { height: 54px; resize: none; }
  input[type=range] { flex: 1; accent-color: #5aa9ff; }
  input[type=checkbox] { width: 14px; height: 14px; flex: none; accent-color: #5aa9ff; }
  .val { width: 36px; text-align: right; font-size: 11px; color: #a3adb8; }
  select option { background: #272c33; }
</style></head>
<body>
  <div class="row"><label>Name</label><input type="text" value="Intro Music" /></div>
  <div class="row"><label>Focused</label><input type="text" class="focused" value="Scene 1 Underscore" /></div>
  <div class="row"><label>In-row edit</label><input type="text" class="name-edit" value="My Cue" /></div>
  <div class="row"><label>Advance</label>
    <select>
      <option>None</option>
      <option>On start</option>
      <option selected>On end</option>
    </select>
  </div>
  <div class="row"><label>Volume</label><input type="range" min="0" max="1" step="0.01" value="0.8" /><span class="val">80%</span></div>
  <div class="row"><label>Armed</label><input type="checkbox" checked /></div>
  <div class="row"><label>Notes</label><textarea>Fade in during blackout. Check level before show.</textarea></div>
</body>
</html>
