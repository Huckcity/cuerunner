<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #1a1d22; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; color: #cdd3da; width: 320px; }
  .tabs { display: flex; border-bottom: 1px solid #2b3038; }
  .tab { padding: 8px 14px; background: transparent; border: none; border-bottom: 2px solid transparent; color: #8e98a4; font-size: 12px; cursor: default; }
  .tab.active { color: #eef1f4; border-bottom-color: #5aa9ff; }
  .tab:hover { color: #a3adb8; }
  .body { padding: 12px; }
  .section-title { font-size: 10px; font-weight: 700; color: #8e98a4; text-transform: uppercase; letter-spacing: 0.08em; margin: 12px 0 8px; }
  .field { display: flex; align-items: center; margin-bottom: 10px; gap: 8px; }
  .field label { width: 90px; flex-shrink: 0; font-size: 11px; color: #a3adb8; text-align: right; }
  .field input, .field select {
    flex: 1; background: #272c33; border: 1px solid #3b424c; border-radius: 3px;
    color: #eef1f4; font-size: 12px; padding: 4px 7px; height: 26px; outline: none;
  }
  .field input.focus { border-color: #5aa9ff; }
  .colors { display: flex; gap: 4px; }
  .cdot { width: 18px; height: 18px; border-radius: 3px; cursor: default; border: 2px solid transparent; }
  .cdot.sel { border-color: #fff; }
</style></head>
<body>
<div class="tabs">
  <button class="tab active">Basics</button>
  <button class="tab">Audio</button>
  <button class="tab">Timing</button>
</div>
<div class="body">
  <div class="field"><label>Number</label><input value="1" /></div>
  <div class="field"><label>Name</label><input value="Intro Music" class="focus" /></div>
  <div class="field">
    <label>Color</label>
    <div class="colors">
      <div class="cdot" style="background:#3b424c"></div>
      <div class="cdot" style="background:#e0443a"></div>
      <div class="cdot" style="background:#f08c2a"></div>
      <div class="cdot" style="background:#f2c94c"></div>
      <div class="cdot sel" style="background:#3bb66b"></div>
      <div class="cdot" style="background:#3d8fe0"></div>
      <div class="cdot" style="background:#9b59d0"></div>
      <div class="cdot" style="background:#e8489b"></div>
    </div>
  </div>
  <div class="section-title">Timing</div>
  <div class="field"><label>Pre-wait (s)</label><input value="0" /></div>
  <div class="field"><label>Post-wait (s)</label><input value="0" /></div>
  <div class="field">
    <label>Advance</label>
    <select><option>None</option><option>On start</option><option selected>On end</option></select>
  </div>
</div>
</body>
</html>
