<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #14171b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .chip { padding: 8px 14px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 9px; opacity: 0.7; font-weight: 400; }
  .sep { height: 1px; background: #272c33; }
  .state-row { display: flex; gap: 8px; }
  .state { padding: 7px 16px; border-radius: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; color: #fff; text-align: center; }
</style></head>
<body>
<div class="row">
  <div class="chip" style="background:#f0b429;color:#000"><span>CUERUNNER</span><span class="name">accent-amber · brand</span></div>
  <div class="chip" style="background:rgba(224,160,32,0.1);color:#f0b429;border:1px solid rgba(224,160,32,0.3)"><span>start: 0:02.5 ✕</span><span class="name">amber overlay · start-time tag</span></div>
</div>
<div class="row">
  <div class="chip" style="background:#5aa9ff;color:#000"><span>#5aa9ff</span><span class="name">accent-blue · interactive</span></div>
  <div class="chip" style="background:#2e4f73;color:#cdd3da"><span>#2e4f73</span><span class="name">blue-dim · waveform unplayed</span></div>
  <div class="chip" style="background:rgba(74,158,255,0.15);color:#5aa9ff;border:1px solid #5aa9ff"><span>focused input</span><span class="name">blue focus border</span></div>
</div>
<div class="sep"></div>
<div class="state-row">
  <div class="state" style="background:#1c7a3c;min-width:80px">▶ GO</div>
  <div class="state" style="background:#3b424c;min-width:80px">■ STOP</div>
  <div class="state" style="background:#8e2b28;min-width:80px">✕ PANIC</div>
</div>
</body>
</html>
