<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #14171b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px 20px; }
  .row { display: flex; flex-direction: column; gap: 7px; }
  .item { display: flex; align-items: baseline; gap: 12px; }
  .sample { font-size: 14px; min-width: 120px; }
  .meta { font-size: 10px; color: #3b424c; font-family: monospace; }
</style></head>
<body>
<div class="row">
  <div class="item"><span class="sample" style="color:#eef1f4">fg-primary #eef1f4</span><span class="meta">headings, selected row</span></div>
  <div class="item"><span class="sample" style="color:#cdd3da">fg-body #cdd3da</span><span class="meta">base body text</span></div>
  <div class="item"><span class="sample" style="color:#cdd3da">fg-secondary #cdd3da</span><span class="meta">cue row text</span></div>
  <div class="item"><span class="sample" style="color:#a3adb8">fg-tertiary #a3adb8</span><span class="meta">workspace name, secondary labels</span></div>
  <div class="item"><span class="sample" style="color:#a3adb8">fg-muted #a3adb8</span><span class="meta">form labels, cue numbers</span></div>
  <div class="item"><span class="sample" style="color:#8e98a4">fg-dim #8e98a4</span><span class="meta">column headers, durations</span></div>
  <div class="item"><span class="sample" style="color:#8e98a4">fg-ghost #8e98a4</span><span class="meta">empty states, placeholders</span></div>
</div>
</body>
</html>
