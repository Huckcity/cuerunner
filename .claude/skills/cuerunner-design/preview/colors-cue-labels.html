<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #14171b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px 20px; }
  .grid { display: flex; gap: 12px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bar { width: 6px; height: 28px; border-radius: 2px; }
  .label { font-size: 9px; color: #8e98a4; text-transform: capitalize; }
  .hex { font-size: 8px; color: #3b424c; font-family: monospace; }
  .title { font-size: 10px; font-weight: 600; color: #8e98a4; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
</style></head>
<body>
<div class="title">Cue Color Labels</div>
<div class="grid">
  <div class="item"><div class="bar" style="background:transparent;border:1px dashed #3b424c"></div><div class="label">none</div></div>
  <div class="item"><div class="bar" style="background:#e0443a"></div><div class="label">red</div><div class="hex">#e0443a</div></div>
  <div class="item"><div class="bar" style="background:#f08c2a"></div><div class="label">orange</div><div class="hex">#f08c2a</div></div>
  <div class="item"><div class="bar" style="background:#f2c94c"></div><div class="label">yellow</div><div class="hex">#f2c94c</div></div>
  <div class="item"><div class="bar" style="background:#3bb66b"></div><div class="label">green</div><div class="hex">#3bb66b</div></div>
  <div class="item"><div class="bar" style="background:#3d8fe0"></div><div class="label">blue</div><div class="hex">#3d8fe0</div></div>
  <div class="item"><div class="bar" style="background:#9b59d0"></div><div class="label">purple</div><div class="hex">#9b59d0</div></div>
  <div class="item"><div class="bar" style="background:#e8489b"></div><div class="label">pink</div><div class="hex">#e8489b</div></div>
</div>
</body>
</html>
