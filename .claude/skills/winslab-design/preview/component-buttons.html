<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #14171b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 9px; font-weight: 600; color: #8e98a4; text-transform: uppercase; letter-spacing: 0.07em; min-width: 60px; }
  /* Cue type buttons */
  .cue-btn { height: 26px; padding: 0 10px; font-size: 11px; border: 1px solid #3b424c; border-radius: 3px; background: #272c33; color: #cdd3da; }
  .cue-btn.hover { background: #30363e; color: #fff; }
  /* Transport buttons */
  .t-btn { height: 36px; padding: 0 20px; border: none; border-radius: 4px; font-size: 14px; font-weight: 700; letter-spacing: 0.05em; }
  .go  { background: #1c7a3c; color: #fff; }
  .go.hover { background: #22924a; }
  .stop { background: #3b424c; color: #cdd3da; }
  .panic { background: #8e2b28; color: #fff; }
  /* Icon/action buttons */
  .icon-btn { padding: 0 6px; height: 26px; background: #272c33; border: 1px solid #3b424c; border-radius: 3px; color: #a3adb8; font-size: 12px; }
  .browse-btn { padding: 0 8px; height: 26px; background: #2b3038; border: 1px solid #8e98a4; border-radius: 3px; color: #cdd3da; font-size: 11px; }
  .add-btn { width: 100%; height: 28px; background: #20242a; border: 1px dashed #3b424c; border-radius: 3px; color: #a3adb8; font-size: 12px; }
  .remove-btn { padding: 0 6px; height: 26px; background: #3a2020; border: 1px solid #5a3030; border-radius: 3px; color: #e0443a; font-size: 11px; }
</style></head>
<body>
<div class="row"><span class="label">Cue type</span>
  <button class="cue-btn">Audio</button>
  <button class="cue-btn hover">MIDI</button>
  <button class="cue-btn">Wait</button>
  <button class="cue-btn">Group</button>
</div>
<div class="row"><span class="label">Transport</span>
  <button class="t-btn stop">■ STOP</button>
  <button class="t-btn go hover">▶ GO</button>
  <button class="t-btn panic">✕ PANIC</button>
</div>
<div class="row"><span class="label">Actions</span>
  <button class="icon-btn">↻</button>
  <button class="browse-btn">Browse</button>
  <button class="add-btn">+ Add Message</button>
  <button class="remove-btn">✕</button>
</div>
</body>
</html>
