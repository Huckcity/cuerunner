<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  body { margin: 0; background: #14171b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; }
  .badge.idle { background: #272c33; color: #8e98a4; }
  .badge.running { background: #1d3a26; color: #4cc36a; }
  .pill { font-size: 10px; padding: 3px 8px; border-radius: 8px; }
  .pill.playing { background: #1d3a26; color: #4cc36a; }
  .pill.prewait { background: #3a3a1a; color: #a3adb8; }
  .drop-indicator { width: 100%; height: 2px; background: #5aa9ff; box-shadow: 0 0 6px rgba(74,158,255,0.6); border-radius: 1px; }
  .label { font-size: 9px; font-weight: 600; color: #8e98a4; text-transform: uppercase; letter-spacing: 0.07em; }
</style></head>
<body>
  <div class="row">
    <span class="label">Running badge</span>
    <span class="badge idle">idle</span>
    <span class="badge running">2 running</span>
  </div>
  <div class="row">
    <span class="label">State pills</span>
    <span class="pill playing">playing</span>
    <span class="pill prewait">pre-wait</span>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Drop indicator</div>
    <div class="drop-indicator"></div>
  </div>
</body>
</html>
