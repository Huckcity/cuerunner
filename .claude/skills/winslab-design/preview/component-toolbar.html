<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #14171b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

  .toolbar {
    display: flex; align-items: center; height: 44px; padding: 0 12px;
    background: #1a1d22; border-bottom: 1px solid #2b3038; gap: 12px;
  }

  .brand {
    font-size: 14px; font-weight: 700; color: #f0b429;
    letter-spacing: 0.05em; text-transform: uppercase;
    background: transparent; border: none; cursor: pointer;
    padding: 4px 8px; border-radius: 3px; flex-shrink: 0;
  }
  .brand:hover { background: #272c33; }

  .wsname {
    font-size: 13px; color: #a3adb8; padding: 2px 6px;
    border: 1px solid transparent; border-radius: 3px; cursor: default;
  }
  .wsname:hover { border-color: #3b424c; }
  .dirty { color: #f0b429; }

  .divider { width: 1px; height: 20px; background: #2b3038; flex-shrink: 0; }

  /* Cue add buttons */
  .cue-group { display: flex; align-items: center; gap: 3px; margin-left: auto; }

  .cue-btn {
    height: 28px; padding: 0 11px; font-size: 12px;
    border: 1px solid #30363e; border-radius: 4px;
    background: #272727; color: #b0b0b0;
    cursor: pointer; font-family: inherit;
    transition: background 0.08s, border-color 0.08s, color 0.08s;
  }
  .cue-btn:hover { background: #2b3038; border-color: #4a4a4a; color: #e0e0e0; }
  .cue-btn:active { background: #222; }

  /* "More" button + dropdown */
  .more-wrap { position: relative; }

  .more-btn {
    height: 28px; padding: 0 10px; font-size: 12px;
    border: 1px solid #30363e; border-radius: 4px;
    background: #272727; color: #777;
    cursor: pointer; font-family: inherit;
    transition: background 0.08s, color 0.08s;
  }
  .more-btn:hover { background: #2b3038; color: #cdd3da; }

  .more-menu {
    position: absolute; top: calc(100% + 5px); right: 0;
    background: #272c33; border: 1px solid #3b424c; border-radius: 5px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55); padding: 4px 0;
    min-width: 130px; z-index: 100;
  }
  .more-menu button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 6px 14px;
    background: transparent; border: none;
    color: #cdd3da; font-size: 12px; font-family: inherit;
    cursor: pointer; text-align: left;
  }
  .more-menu button:hover { background: #383838; color: #eee; }
  .more-menu .glyph { font-size: 13px; color: #8e98a4; width: 16px; text-align: center; }
</style></head>
<body>
<div class="toolbar">
  <button class="brand">WinsLab ▾</button>
  <span class="wsname">My Show<span class="dirty"> ●</span></span>

  <div class="divider"></div>

  <div class="cue-group">
    <button class="cue-btn">♪ Audio</button>
    <button class="cue-btn">▤ Group</button>
    <button class="cue-btn">↘ Fade</button>
    <button class="cue-btn">⏱ Wait</button>
    <button class="cue-btn">■ Stop</button>

    <div class="more-wrap">
      <button class="more-btn">More ▾</button>
      <!-- dropdown shown statically for preview -->
      <div class="more-menu">
        <button><span class="glyph">M</span>MIDI</button>
        <button><span class="glyph">O</span>OSC</button>
        <button><span class="glyph">⊕</span>Network</button>
        <button><span class="glyph">{ }</span>Script</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
