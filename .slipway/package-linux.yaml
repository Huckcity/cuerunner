# The Linux slice of a release on Slipway (port of build.yml `build-linux`): AppImage and .deb, the packaged-MIDI check
# and SHA256SUMS, kept as run artifacts. Manual and publishes nothing: the feed at pub.cuerunner.app/latest/ reaches
# users' machines, so nothing here touches it (publishing waits on the secrets in needs-adam #22).
# Pull requests from forks start nothing on Slipway (PIPELINE_SPEC section 2).
version: 1
name: package-linux
description: Build the Linux AppImage and .deb, verify them and record SHA256SUMS
on:
  manual: {}
defaults:
  runs_on: [linux, x64, docker]
  timeout: 45m
  shell: bash
stages:
  - name: package
    jobs:
      - name: linux
        container:
          image: node:24-bookworm
        cache:
          # Literal key, see ci.yaml and slipway-systems/slipway#375; follows FFMPEG_VERSION by hand.
          - key: ffmpeg-decoder-8.1.2
            paths: [native/audio/build/decoders]
        steps:
          - uses: slipway/checkout@v1
          - name: System packages
            run: apt-get update -qq && apt-get install -y -qq libasound2-dev build-essential
          - name: Hand the workspace to the node user
            run: chown -R node:node .
          - name: Install dependencies
            run: runuser -u node -- npm ci --legacy-peer-deps
          - name: Build and package
            run: runuser -u node -- npm run dist:linux
          # `midi` is optional: a runner that cannot build it ships an app with no MIDI in it (v0.16.0).
          - name: The packaged app carries the MIDI module
            run: runuser -u node -- node scripts/verify-packaged-midi.mjs dist
          - name: Name the artifacts and record SHA256SUMS
            run: |
              cd dist
              test -n "$(find . -maxdepth 1 -name '*.AppImage')" || { echo "no AppImage in dist/"; exit 1; }
              test -n "$(find . -maxdepth 1 -name '*.deb')" || { echo "no .deb in dist/"; exit 1; }
              sha256sum *.AppImage *.deb > SHA256SUMS
              sha256sum -c SHA256SUMS
              cat SHA256SUMS
          # The staged feed: electron-builder's `latest-linux.yml` must name this AppImage with the SHA-512 the app
          # checks a download against. Checked here and kept as an artifact only; nothing is uploaded.
          - name: The staged feed names this AppImage and its SHA-512
            run: |
              cd dist
              appi=$(basename "$(find . -maxdepth 1 -name '*.AppImage' | head -n1)")
              test -f latest-linux.yml || { echo "electron-builder wrote no dist/latest-linux.yml"; exit 1; }
              grep -qF "url: $appi" latest-linux.yml || { echo "latest-linux.yml does not name $appi"; exit 1; }
              want=$(openssl dgst -sha512 -binary "$appi" | base64 -w0)
              grep -qF "sha512: $want" latest-linux.yml || { echo "latest-linux.yml sha512 does not match $appi"; exit 1; }
              cat latest-linux.yml
        artifacts:
          - { name: linux-packages, path: "dist/*.AppImage dist/*.deb dist/SHA256SUMS dist/latest-linux.yml", when: success, retention: 30d }
