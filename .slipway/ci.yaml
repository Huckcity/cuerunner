# Cuerunner CI on Slipway, Linux lane (first slice of the port from .github/workflows/ci.yml).
# Pull requests from forks start nothing on Slipway (PIPELINE_SPEC section 2), so a stranger's
# pipeline file never reaches the runner pool.
# Not yet ported: windows and macOS lanes (no runners), integration, soak.
version: 1
name: ci
description: Typecheck, unit tests, e2e and native engine on Linux
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'e2e/**'
      - 'integration/**'
      - 'scripts/**'
      - 'website/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'electron.vite.config.*'
      - '.slipway/**'
  manual: {}
concurrency:
  group: ci-${{ git.ref }}
  cancel_in_progress: true
defaults:
  runs_on: [linux, x64, docker]
  timeout: 45m
  shell: bash
jobs:
  - name: typecheck
    matrix:
      node: ["24", "26"]
    container:
      image: node:${{ matrix.node }}-bookworm
    steps:
      - uses: slipway/checkout@v1
      - name: ALSA headers
        run: apt-get update -qq && apt-get install -y -qq libasound2-dev
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
  - name: unit-test
    matrix:
      node: ["24", "26"]
    container:
      image: node:${{ matrix.node }}-bookworm
    steps:
      - uses: slipway/checkout@v1
      - name: ALSA headers and compiler
        run: apt-get update -qq && apt-get install -y -qq libasound2-dev build-essential
      # Not as root: the workspace tests rely on chmod denying access (a read-only directory,
      # an unreadable file), which root bypasses. The image's `node` user is uid 1000.
      - name: Hand the workspace to the node user
        run: chown -R node:node .
      - name: Install dependencies
        run: runuser -u node -- npm ci --legacy-peer-deps
      - name: Unit tests
        run: runuser -u node -- npm test
  - name: e2e
    container:
      image: node:24-bookworm
    timeout: 60m
    cache:
      # The pinned FFmpeg helper takes 3.5 min to build. The key names the pinned FFmpeg version and must change with
      # FFMPEG_VERSION in scripts/build-ffmpeg-linux.mjs (hashFiles() here fails at save time: see slipway-systems/slipway#375).
      - key: ffmpeg-decoder-8.1.2
        paths: [native/audio/build/decoders]
    steps:
      - uses: slipway/checkout@v1
      - name: System packages
        run: apt-get update -qq && apt-get install -y -qq libasound2-dev build-essential xvfb
      - name: Chromium runtime libraries
        run: npx --yes playwright install-deps
      # Non-root for the same reason as unit-test (and Chromium's sandbox).
      - name: Hand the workspace to the node user
        run: chown -R node:node .
      - name: Install dependencies
        run: runuser -u node -- npm ci --legacy-peer-deps
      # Linux decodes a video cue's sound through the packaged FFmpeg helper (built once from the pinned release).
      - name: Build the engine and the decoder
        run: runuser -u node -- node scripts/ensure-native.mjs --with-decoders
      - name: E2E tests
        run: runuser -u node -- npm run test:e2e
    artifacts:
      - { name: e2e-results, path: test-results/**, when: failure, retention: 7d }
  # native.yml: the engine's acceptance scripts (real mixer, offline render), then a minute of soak.
  # Timing-sensitive: matrix-bench floors the realtime factor, so it measures the host's spare cores.
  - name: native
    container:
      image: node:24-bookworm
    timeout: 60m
    cache:
      # The pinned FFmpeg helper takes 3.5 min to build. The key names the pinned FFmpeg version and must change with
      # FFMPEG_VERSION in scripts/build-ffmpeg-linux.mjs (hashFiles() here fails at save time: see slipway-systems/slipway#375).
      - key: ffmpeg-decoder-8.1.2
        paths: [native/audio/build/decoders]
    steps:
      - uses: slipway/checkout@v1
      - name: System packages
        run: apt-get update -qq && apt-get install -y -qq libasound2-dev build-essential
      - name: Hand the workspace to the node user
        run: chown -R node:node .
      - name: Install dependencies
        run: runuser -u node -- npm ci --legacy-peer-deps
      # The pretest hook builds the pinned FFmpeg decoder on Linux (needs network).
      - name: Native acceptance
        run: runuser -u node -- npm run test:native
      - name: Soak smoke (a minute of show)
        run: runuser -u node -- npm run soak -- --minutes 1
  # The races that crash a show pass every check above; only the sanitizer sees the access.
  - name: native-tsan
    container:
      image: node:24-bookworm
    timeout: 60m
    steps:
      - uses: slipway/checkout@v1
      - name: System packages
        run: apt-get update -qq && apt-get install -y -qq libasound2-dev build-essential
      - name: Hand the workspace to the node user
        run: chown -R node:node .
      - name: Install dependencies
        run: runuser -u node -- npm ci --legacy-peer-deps
      - name: Engine under ThreadSanitizer
        run: runuser -u node -- npm run test:native:tsan
